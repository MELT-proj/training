# MELT Training Configuration
# Following NeMo SpeechLM2 configuration structure
#
# Usage:
#   python src/train.py --config config/train/asr.yaml
#   python src/train.py --config config/train/asr.yaml --trainer.max_steps=1000
#   python src/train.py --config config/train/asr.yaml --run.exp_name=my_experiment

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: metric-iwslt26
  dry_run: false

# =============================================================================
# Model Configuration
# =============================================================================
model:
  encoder:
    freeze: true
    max_audio_seq_len: 1500 # for frames of 20ms, this is 30s

  decoder:
    attn_implementation: flash_attention_2
    freeze: false

  adapter:
    freeze: true

  lora:
    enabled: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    bias: none

  ckpt: /mnt/scratch-artemis/giuseppe/melt-data/outputs/MA-v1.2.7/

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000
  apply_chat_template: true

  train_ds:
    # total_hours: 54.26
    # total_cuts: 15661
    force_estimate: true

    input_cfg:
      # Hearing 2 translate HumanEval split (seamlessm4t)
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_humeval/seamlessm4t/de/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_humeval/seamlessm4t/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score
      # Hearing 2 translate HumanEval split (voxtral-small-24b)
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_humeval/voxtral-small-24b/de/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_humeval/voxtral-small-24b/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score
      # Hearing 2 translate HumanEval split (aya_canary-v2)
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_humeval/aya_canary-v2/de/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_humeval/aya_canary-v2/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score

      # Hearing 2 translate MetricX split (seamlessm4t)
      # - type: lhotse_shar
      #   shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_metrics/seamlessm4t/de/de/train
      #   tags:
      #     task: speechqe
      #     lang: de
      #     target_field: custom.score
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_metrics/seamlessm4t/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score
          normalize_factor: 100.0
      # Hearing 2 translate MetricX split (voxtral-small-24b)
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_metrics/voxtral-small-24b/de/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
          normalize_factor: 100.0
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_metrics/voxtral-small-24b/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score
          normalize_factor: 100.0
      # Hearing 2 translate MetricX split (aya_canary-v2)
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_metrics/aya_canary-v2/de/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
          normalize_factor: 100.0
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/hearing2translate_metrics/aya_canary-v2/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score
          normalize_factor: 100.0

      # Voxpopuli MetricX 24 XL
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/VP_metrics/de/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/VP_metrics/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score
      
      # VoxPopuli Perturbed MetricX
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/VP_metrics_perturbed/de/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/VP_metrics_perturbed/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score

      # Covost
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/covost_metrics/de/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/covost_metrics/zh/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score

      # Official IWSLT26 splitfiles
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/giuseppe/melt-data/shar/iwslt_metrics/de/train/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
          normalize_factor: 100.0
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/giuseppe/melt-data/shar/iwslt_metrics/zh/train/train
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score
          normalize_factor: 100.0
      - type: lhotse_shar
        shar_path: /mnt/scratch-artemis/giuseppe/melt-data/shar/iwslt_metrics/de/train_synthetic/train
        tags:
          task: speechqe
          lang: de
          target_field: custom.score

    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    batch_duration: 120  # seconds of audio per batch
    quadratic_duration: 25 # see https://lhotse.readthedocs.io/en/latest/datasets.html#lhotse.dataset.sampling.TimeConstraint

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    bucket_buffer_size: 10000
    # bucket_duration_bins: [4.08, 4.95, 5.65, 6.33, 6.85, 7.36, 7.94, 8.46, 9.22, 10.26, 11.76, 13.51, 16.58, 21.43, 23.92, 26.24, 29.63, 31.67, 33.32, 35.22, 37.43, 39.2, 40.19, 42.1, 42.97, 43.93, 45.33, 46.72, 48.19]

    # Sampling
    shuffle: true
    shuffle_buffer_size: 10000
    drop_last: false
    seed: 42
    shard_seed: 42

    # Duration filtering
    min_duration: 0.5
    max_duration: 120.0

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 2
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    # total_hours: 10.53  # Optional: total hours of data for estimation
    # total_cuts: 5514  # Optional: total number of cuts for estimation
    force_estimate: true  # Force estimation of total_hours at start

    input_cfg:
      # - type: lhotse_shar
      #   shar_path: /mnt/scratch-artemis/sonal/IWSLT26/data/VP_metrics/zh/train
      #   max_samples: 2000
      #   tags:
      #     task: speechqe
      #     lang: zh
      #     target_field: custom.score

      # Official IWSLT26 splitfiles
      - type: lhotse_shar
        shar_path: /mnt/home/giuseppe/myscratch/melt-data/shar/iwslt_metrics/de/train/validation
        tags:
          task: speechqe
          lang: de
          target_field: custom.score
          normalize_factor: 100.0
      - type: lhotse_shar
        shar_path: /mnt/home/giuseppe/myscratch/melt-data/shar/iwslt_metrics/zh/train/validation
        tags:
          task: speechqe
          lang: zh
          target_field: custom.score
          normalize_factor: 100.0
      
    batch_size: null
    batch_duration: 180.0
    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    bucket_buffer_size: 5000
    # bucket_duration_bins: [2.72, 3.6, 4.24, 4.8, 5.2, 5.6, 5.76, 6.08, 6.4, 6.72, 7.11, 7.52, 7.76, 8.08, 8.4, 8.8, 9.04, 9.44, 9.92, 10.32, 10.72, 11.1, 11.68, 12.4, 12.96, 14.0, 14.8, 17.6, 20.8]
    shuffle: false
    drop_last: false
    min_duration: 0.5
    max_duration: 600.0
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    sample_rate: 16000
    text_field: text
    lang_field: lang

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}/MELT_QE_v1.0
  overwrite_output_dir: true
  seed: 42
  do_train: true
  do_eval: false
  eval_on_start: false
  average_tokens_across_devices: true
  resume_from_checkpoint: false

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse, set to 1
  # Eval does NOT go through Lhotse — it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule
  lr_scheduler_type: cosine
  warmup_steps: 30

  # Duration
  num_train_epochs: 1
  max_steps: -1

  # Logging
  logging_strategy: steps
  logging_steps: 5
  report_to: wandb

  # Evaluation
  eval_strategy: steps # "no" # steps
  eval_steps: 100000
  # This project trains a regression head (MELTForSequenceClassification), which
  # has no generate(); the default of true belongs to the causal-LM path.
  predict_with_generate: false

  # Checkpointing
  save_strategy: steps
  save_steps: 100000
  save_total_limit: 3

  # Performance
  bf16: true
  group_by_length: false  # Handled by Lhotse bucketing
  dataloader_num_workers: 0  # Workers handled by Lhotse
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0
  weight_decay: 0.01

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95

  # encoder_lr: 6e-6 # Not used since it's frozen
  decoder_lr: 2e-4
  adapter_lr: 2e-4
  min_lr_scale: 0.1
