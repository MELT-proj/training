# ABL-IFT-125 — ablation campaign, stage 2 (instruction fine-tuning).
#
# Rendered by build_campaign_config.py from config/train/SFT-v1.4.0.yaml:
#
#   python projects/ablation-campaign/build_campaign_config.py \
#     --template config/train/SFT-v1.4.0.yaml \
#     --datasets-root $LOCAL_DATASETS_DIR \
#     --cache projects/ablation-campaign/campaign_hours.json \
#     --budget-hours 125 --tasks both --exclude-corpus fleurs \
#     --out projects/ablation-campaign/ABL-IFT-125.yaml
#
# Ten groups at 125 h each -- ASR for en/de/fr/es/it and ST for
# de/fr/es/it -> en plus the en -> de probe -- 1250 h total, over the same
# language set stage 1 (ABL-MA-125-asr.yaml) trained on. nl/pt/pl/uk stay
# held out.
#
# Hand-applied on top of the render (everything else is the generator's):
#
#   1. apply_chat_template: true. The generator hard-codes it to false because
#      it is written for modality-alignment renders and says to flip it on the
#      run; for a stage-2 config it belongs in the file.
#   2. One fixed prompt per task instead of a random draw over TASK_TEMPLATES,
#      so instruction wording is not a source of variance across arms.
#   3. seed/shard_seed 1337 rather than 42, so stage 2 does not replay the cuts
#      stage 1 streamed.
#   4. model.ckpt -> the consolidated stage-1 model.
#   5. adapter._type: mlp, matching the campaign baseline and the stage-1
#      checkpoint. Inert while model.ckpt is set (the architecture is read from
#      the checkpoint) but wrong if this config is ever run without it.
#   6. max_steps pinned rather than derived from the unreliable epoch estimate.
#
# NOTE the stage-1/stage-2 split, which comes from the SFT template and is the
# point of this stage: the ADAPTER IS FROZEN and the DECODER IS TRAINED, the
# reverse of ABL-MA-125-asr.yaml. Encoder stays frozen throughout.

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: ABL-IFT-125-v060
  dry_run: false

# =============================================================================
# Model Configuration
# =============================================================================
model:
  encoder:
    name: facebook/w2v-bert-2.0
    freeze: true
    max_audio_seq_len: 1500 # for frames of 20ms, this is 30s

  decoder:
    name: Qwen/Qwen3-1.7B
    attn_implementation: flash_attention_2
    freeze: false
    bos_token: <|startoftext|>
    eos_token: <|endoftext|>
    pad_token: <|text_pad|> # used if not specified in tokenizer
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>
  
  adapter:
    # Frozen here: stage 1 trained it, stage 2 tunes the decoder on top.
    freeze: true
    # The campaign baseline is the simplest adapter available, and the stage-1
    # checkpoint was trained with it. While model.ckpt is set this field is
    # inert -- MELTConfig is read from the checkpoint, so the architecture is
    # whatever stage 1 used -- but leaving the template's `conformer` here
    # would silently build the wrong model if the checkpoint were ever removed.
    _type: mlp

  # Stage 2 initialises from the stage-1 (MA) model. This must be a directory
  # MELTForCausalLM.from_pretrained can read: config.json,
  # preprocessor_config.json and consolidated weights.
  #
  # A raw checkpoint-N/ directory is NOT loadable -- it holds sharded FSDP
  # state (pytorch_model_fsdp_0/) and no config. The path below is
  # checkpoint-3000 consolidated with utils/merge_fsdp_weight.py plus the
  # config/processor files rebuilt from the run's resolved_config.json.
  #
  # Container path: OUTPUT_DIR is bound to /workspace/outputs.
  ckpt: /workspace/outputs/ABL-MA-125-asr-v060-ckpt3000

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000
  strict_text_field: true

  # -- Instruction formatting ----------------------------------------------
  # build_campaign_config.py writes `false` here unconditionally (it renders
  # modality-alignment configs and expects the run to override it). Stage 2
  # wants it on, so it is set in the file rather than on the command line.
  apply_chat_template: true

  # Qwen3 emits plain ChatML. There is deliberately no separate qwen3 entry in
  # chat_templates.py: the empty <think></think> block Qwen3 opens the
  # assistant turn with lands inside the kept span either way, because the
  # masking treats the boundaries as inclusive. Consequence for downstream:
  # decoded hypotheses carry that prefix and EVAL MUST STRIP IT.
  chat_template_config: chatml

  # One fixed prompt per task rather than the default random draw over all
  # TASK_TEMPLATES entries, so instruction wording is a constant. These are the
  # first template listed for each task in
  # melt/training/data/audio/lhotse/helpers.py.
  #
  # {lang} resolves to the TARGET language for st (get_tags_from_cut collapses
  # `lang` to tgt_lang), so the st prompt reads "Translate this audio to
  # English." for the X->en directions and "... to German." for the en-de probe.
  prompt_template_selection: custom
  prompt_template:
    asr: "{audio_token} Transcribe this audio in {lang}."
    st: "{audio_token} Translate this audio to {lang}."


  train_ds:
    # Data sources - list of datasets to load
    # Generated by infra/compute_mix_weights.py — do not hand-edit.
    # Two-tier language/corpus balancing, Section 3.3.1 of arXiv:2509.14128,
    # with alpha=0.5 (corpus within language) and beta=0.5 (across languages).
    #
    # Group weight   = p_l, the language entry's share of the mix.
    # Child weight   = p_c, the corpus's share within its language entry.
    # The two levels are muxed separately, so the sampling probability of a
    # corpus is the product p_l * p_c. Do not pre-multiply them.
    #
    # Do NOT set `reweight_temperature` alongside this file (NeMo only).
    # alpha/beta are already baked into the weights below; NeMo would raise
    # them to a further power. Both levels already sum to 1, so the
    # normalisation itself is a no-op.
    #
    # 130 corpora, 65 language entries, 319,054.7 h total.
    input_cfg:
      # ASR en: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/train
            weight: 0.36361689
            tags:
              task: asr
              lang: en
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/train
            weight: 0.35322971
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/English/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: en
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/train
            weight: 0.11146115
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR de: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/train
            weight: 0.36361689
            tags:
              task: asr
              lang: de
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/train
            weight: 0.35322971
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: de
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/train
            weight: 0.11146115
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR fr: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: fr
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/train
            weight: 0.36361689
            tags:
              task: asr
              lang: fr
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/train
            weight: 0.35322971
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: fr
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/train
            weight: 0.11146115
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR es: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: es
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/train
            weight: 0.36361689
            tags:
              task: asr
              lang: es
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/train
            weight: 0.35322971
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: es
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/train
            weight: 0.11146115
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR it: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: it
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/train
            weight: 0.36361689
            tags:
              task: asr
              lang: it
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/train
            weight: 0.35322971
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: it
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/train
            weight: 0.11146115
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ST de->en: 125.0 h (7,429.1 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: de
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: de
              tgt_lang: en
              text_field: custom.translation_en
      # ST fr->en: 125.0 h (11,511.7 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: fr
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: fr
              tgt_lang: en
              text_field: custom.translation_en
      # ST es->en: 125.0 h (25,833.3 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: es
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: es
              tgt_lang: en
              text_field: custom.translation_en
      # ST it->en: 125.0 h (6,024.7 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: it
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: it
              tgt_lang: en
              text_field: custom.translation_en
      # ST en->de: 125.0 h (429.9 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: en
          tgt_lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/en_de/train
            weight: 1.00000000
            tags:
              task: st
              src_lang: en
              tgt_lang: de
    # Stats
    # total_hours is overwritten by infra/compute_mix_weights.py from its own
    # measurement; total_cuts is not (see docs/mixture_weights.md), so it is
    # maintained here. Both count the 22 yodas-granary ast leaves twice, once
    # per task, because the mixture draws from each of those leaves twice.
    total_hours: 1250.00
    total_cuts: 120949122
    force_estimate: false

    # Duration filtering
    min_duration: 0.5
    max_duration: 120.0
    
    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    batch_duration: 90  # seconds of audio per batch

    # Drop cuts whose transcript is pathologically long for their audio.
    #
    # Batches are budgeted by *audio* seconds, so a cut with short audio and a
    # runaway transcript passes the duration constraint and still sets the
    # padded width of the whole batch. That is what ended artemis job 328290 at
    # step 4292: 17 cuts, only 224 feature frames, but input_ids [17, 1158] and
    # 77.45 GB allocated on an 80 GB H100. `input_ids` carries a single
    # `<|audio|>` token per audio (the expansion is at model level, and the
    # processor's own expansion path is commented out), so that 1158 was text.
    #
    # 400 is chosen to remove only the tail: measured over an 800-cut head
    # sample of all 25 train sources, p99 num_tokens is <=195 and the largest
    # single value is 291 (voxpopuli/de). Every source carries
    # `custom.num_tokens`, MLS non-English included, so the filter is not blind
    # anywhere in this mixture. Note the sample covers the head of each shar,
    # not the tail the OOM came from, so this bounds the *cost* of the filter
    # rather than proving what it removes.
    #
    # Cuts without `custom.num_tokens` are kept, not dropped (see
    # dataloader.py's _token_filter), so this can never silently delete a source.
    max_tokens: 400
    quadratic_duration: 30 # see https://lhotse.readthedocs.io/en/latest/datasets.html#lhotse.dataset.sampling.TimeConstraint

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    buffer_size: 10000
    bucket_duration_bins: [2.4, 3.54, 4.46, 5.34, 6.19, 7.12, 8.17, 9.4, 10.58, 11.62, 12.65, 13.67, 14.56, 15.08, 16.12, 17.19, 18.28, 19.41, 21.12, 23.3, 25.4, 27.5, 29.58, 33.52, 35.54, 36.78, 37.78, 38.58, 39.3]

    # Sampling
    shuffle: true
    drop_last: false
    # Stage 2 draws a different slice of each source than stage 1 did: both
    # stages stream the same corpora, so reusing 42 would replay audio the
    # model has already seen. NOTE the launcher overrides shard_seed from
    # $MELT_SEED, so the submit command must pass MELT_SEED=1337 as well --
    # the value here is only what a bare `python train.py` would use.
    seed: 1337
    # A fixed scalar, not 'randomized': with indexed sources the partitioning
    # already separates the per-(rank, worker) streams, and the loader ignores
    # 'randomized' and falls back to `seed` with a warning anyway.
    shard_seed: 1337

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    # Generation-based evaluation costs ~N sequential decoder steps per sample
    # instead of a single forward, so the full validation set is not affordable.
    #
    # NOTE this cap is applied PER NAMED EVAL SET, not per config: here
    # 7 named eval sets x 140 = ~980 utterances per eval.
    #
    # Measured on an H100 (artemis job 327830): ~2.2 s/utterance at
    # generation_max_length 64, and the cost is roughly linear in the token
    # budget because nothing in the training targets teaches the model to stop
    # (see docs/generation_eval.md) -- so every sample spends the whole budget.
    # Budget the eval against eval_steps before raising either number.
    #
    # materialize_cuts_for_eval applies the cap with a seeded shuffle, so every
    # run scores the same subset.
    max_samples: 140
    input_cfg:
      # ASR en validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.metadata.sentence
        # 27.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/dev
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 15.8 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR de validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.metadata.sentence
        # 2.5 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/dev
        tags:
          task: asr
          lang: de
          text_field: custom.pnc_text
        # 14.3 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR fr validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/validation
        tags:
          task: asr
          lang: fr
          text_field: custom.metadata.sentence
        # 24.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/dev
        tags:
          task: asr
          lang: fr
          text_field: custom.pnc_text
        # 10.1 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/validation
        tags:
          task: asr
          lang: fr
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR es validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.metadata.sentence
        # 26.8 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/dev
        tags:
          task: asr
          lang: es
          text_field: custom.pnc_text
        # 10.0 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.pnc_text
        # 5.1 h of voxpopuli (validation split)
      # ASR it validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.metadata.sentence
        # 25.4 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/dev
        tags:
          task: asr
          lang: it
          text_field: custom.pnc_text
        # 5.2 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.pnc_text
        # 4.5 h of voxpopuli (validation split)
      # ST en->de validation (dev split): 26.0 h. No X->en probe: yodas-granary's `ast` sets have no held-out split.
      - type: lhotse_shar
        name: st_en_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/en_de/dev
        tags:
          task: st
          src_lang: en
          tgt_lang: de
    # Statistics
    total_hours: 212.08
    total_cuts: 101728  # measured by infra/check_training_config.py (H3)
    force_estimate: true

    # data.strict_text_field is not inherited by eval (resolve_eval_data_config
    # only carries apply_chat_template/prompt_template/*/chat_template_config,
    # dataloader.py:1226-1231), so it is set explicitly here to match training.
    strict_text_field: true

    # Batch composition
    batch_size: 16
    batch_duration: null

    buffer_size: 20000
    shuffle: false
    drop_last: true
    min_duration: 0.5
    max_duration: 120.0
    num_workers: 0
    pin_memory: true
    prefetch_factor: null
    sample_rate: 16000
    text_field: text
    lang_field: lang

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 1337
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse, set to 1
  # Eval does NOT go through Lhotse — it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule
  lr_scheduler_type: cosine
  warmup_steps: 20

  # Duration
  # One pass over the 1250 h mixture = 125 h per group (5 ASR languages +
  # 5 ST directions). max_steps is pinned rather than derived: the epoch
  # estimate comes from the config's stale total_cuts and is unreliable (#46).
  #
  #   max_steps = total_hours * 3600 / (batch_duration * world_size * grad_accum)
  #             = 1250 * 3600 / (90 * 2 * 4) = 6250
  #
  # Nominal. Measured throughput on the stage-1 run came in below the figure
  # this formula assumes, so check the train_hours/* series in W&B and extend
  # if 125 h per group has to be reached exactly.
  num_train_epochs: 1
  max_steps: 6250

  # Logging
  logging_strategy: steps
  logging_steps: 5
  report_to: wandb

  # Evaluation
  eval_strategy: steps # "no" # steps
  # 6 named eval sets x 140 samples at ~0.86 samples/s is ~16 min per pass.
  # At the template's 100 this would be 62 passes -- more wall-clock than
  # the training itself. 500 matches what the stage-1 run actually used.
  eval_steps: 500
  batch_eval_metrics: true

  # Evaluation decodes with generate() -- greedy, at most this many *new*
  # tokens (MELT's prompt is audio, so generation_max_length is read as a
  # new-token budget; see MELTTrainer._generation_kwargs).
  predict_with_generate: true
  # 64, not the template's 256, and set here rather than on the command line.
  # Stage 1 (ABL-MA-125) ran at 64 via `--trainer.generation_max_length 64`, so
  # a config that says 256 does not describe the run that produced the numbers
  # this stage is compared against -- which is exactly how a 4x eval-cost gap
  # went unnoticed. Nothing in the targets teaches the model to stop (every
  # sample hits the budget: profiled new_tokens=64/64), so cost is linear in
  # this number and a longer budget only adds insertions.
  generation_max_length: 64
  generation_num_beams: 1

  # Checkpointing
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 5

  # Performance
  bf16: true
  group_by_length: false
  dataloader_num_workers: 4  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true
  # Reference/hypothesis pairs printed to stdout and logged to W&B each eval.
  # 0 disables.
  log_num_samples: 10

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95
  encoder_lr: 6e-6
  decoder_lr: 2e-5
  adapter_lr: 2e-4
  min_lr_scale: 0.1
