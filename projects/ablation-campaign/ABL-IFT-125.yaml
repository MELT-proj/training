# ABL-IFT-125 — ablation campaign, stage 2 (instruction fine-tuning).
#
# Stage 1 is ABL-MA-125-asr.yaml (modality alignment, ASR only, bare
# "{audio_token}{t}" format). This stage differs from it in four ways:
#
#   1. ASR *and* ST. Ten groups at 125 h each -- five ASR languages
#      (en/de/fr/es/it) and five ST directions (de/fr/es/it -> en, plus the
#      en -> de probe) -- for 1250 h total. Same language set as stage 1; the
#      held-out languages (nl/pt/pl/uk) stay held out.
#   2. Chat template on, with ONE fixed prompt per task instead of a random
#      draw over TASK_TEMPLATES, so prompt wording is not a source of variance.
#   3. A different seed (1337, not 42), so stage 2 does not simply replay the
#      cuts stage 1 already saw. See the note on data.train_ds.seed -- the
#      launcher overrides shard_seed from $MELT_SEED, so the submit command has
#      to pass it too.
#   4. model.ckpt points at the finished stage-1 model.
#
# Regenerate the mixture (not the edits above) with:
#   python projects/ablation-campaign/build_campaign_config.py \
#     --template projects/ablation-campaign/ABL-MA-125-asr.yaml \
#     --datasets-root $LOCAL_DATASETS_DIR \
#     --cache projects/ablation-campaign/campaign_hours.json \
#     --budget-hours 125 --tasks both --exclude-corpus fleurs \
#     --out projects/ablation-campaign/ABL-IFT-125.yaml
#
# Validated with: infra/check_training_config.py --config <this file>
#   -> 22 passed, 1 warning (C3, benign), 0 failed.

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: ABL-IFT-125-v060
  dry_run: false

# =============================================================================
# Model Configuration
# =============================================================================
model:
  encoder:
    name: facebook/w2v-bert-2.0
    freeze: true
    max_audio_seq_len: 1500 # for frames of 20ms, this is 30s

  decoder:
    name: Qwen/Qwen3-1.7B
    attn_implementation: flash_attention_2
    freeze: true
    bos_token: <|startoftext|>
    eos_token: <|endoftext|>
    pad_token: <|text_pad|> # used if not specified in tokenizer
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>
  
  adapter:
    freeze: false
    _type: mlp
#   num_adapter_layers: 2
#   adapter_kernel_size: 3
#   adapter_stride: 2
  
  # Stage 2 (IFT) initialises from the stage-1 (MA) model. This must be a
  # directory `MELTForCausalLM.from_pretrained` can read -- config.json,
  # preprocessor_config.json and consolidated weights -- which is what
  # train.py writes into the OUTPUT DIR ROOT when a run finishes
  # (trainer.save_model() + processor/config.save_pretrained()).
  #
  # It is NOT a `checkpoint-N/` directory: those hold sharded FSDP state
  # (pytorch_model_fsdp_0/) with no config.json, and from_pretrained cannot
  # read them. To start from an intermediate checkpoint instead, consolidate
  # it first with utils/merge_fsdp_weight.py and copy the config/processor
  # files next to the merged weights.
  #
  # Container path: OUTPUT_DIR is bound to /workspace/outputs.
  ckpt: /workspace/outputs/ABL-MA-125-asr-v060

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000
  strict_text_field: true

  # -- Instruction formatting (stage 2) -------------------------------------
  # Stage 1 (MA) trained on the bare "{audio_token}{t}" format. Stage 2 wraps
  # every example in the decoder's chat template so the model learns the
  # instruction-following interface it will be prompted with at eval time.
  apply_chat_template: true

  # Qwen3 emits plain ChatML, so `chatml` is the right boundary config. There
  # is deliberately no separate qwen3 entry: the empty <think></think> block
  # Qwen3 opens the assistant turn with lands inside the kept span either way,
  # because mask_non_assistant_tokens treats the boundaries as inclusive. See
  # melt/training/data/chat_templates.py.
  chat_template_config: chatml

  # One fixed prompt per task rather than the default random draw over all
  # TASK_TEMPLATES entries, so the instruction wording is a constant and not a
  # source of variance across the ablation arms. These are the first template
  # listed for each task in melt/training/data/audio/lhotse/helpers.py.
  #
  # {lang} resolves to the TARGET language for st (get_tags_from_cut collapses
  # `lang` to tgt_lang for translation), so the st prompt reads "Translate this
  # audio to English." for the X->en directions and "... to German." for the
  # en-de probe.
  prompt_template_selection: custom
  prompt_template:
    asr: "{audio_token} Transcribe this audio in {lang}."
    st: "{audio_token} Translate this audio to {lang}."

  train_ds:
    # Data sources - list of datasets to load
    # Generated by infra/compute_mix_weights.py — do not hand-edit.
    # Two-tier language/corpus balancing, Section 3.3.1 of arXiv:2509.14128,
    # with alpha=0.5 (corpus within language) and beta=0.5 (across languages).
    #
    # Group weight   = p_l, the language entry's share of the mix.
    # Child weight   = p_c, the corpus's share within its language entry.
    # The two levels are muxed separately, so the sampling probability of a
    # corpus is the product p_l * p_c. Do not pre-multiply them.
    #
    # Do NOT set `reweight_temperature` alongside this file (NeMo only).
    # alpha/beta are already baked into the weights below; NeMo would raise
    # them to a further power. Both levels already sum to 1, so the
    # normalisation itself is a no-op.
    #
    # 130 corpora, 65 language entries, 319,054.7 h total.
    input_cfg:
      # ASR en: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/train
            weight: 0.36361689
            tags:
              task: asr
              lang: en
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/train
            weight: 0.35322971
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/English/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: en
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/train
            weight: 0.11146115
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR de: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/train
            weight: 0.36361689
            tags:
              task: asr
              lang: de
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/train
            weight: 0.35322971
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: de
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/train
            weight: 0.11146115
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR fr: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: fr
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/train
            weight: 0.36361689
            tags:
              task: asr
              lang: fr
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/train
            weight: 0.35322971
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: fr
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/train
            weight: 0.11146115
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR es: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: es
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/train
            weight: 0.36361689
            tags:
              task: asr
              lang: es
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/train
            weight: 0.35322971
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: es
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/train
            weight: 0.11146115
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR it: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: it
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/train
            weight: 0.36361689
            tags:
              task: asr
              lang: it
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/train
            weight: 0.35322971
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: it
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/train
            weight: 0.11146115
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ST de->en: 125.0 h (7,429.1 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: de
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: de
              tgt_lang: en
              text_field: custom.translation_en
      # ST fr->en: 125.0 h (11,511.7 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: fr
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: fr
              tgt_lang: en
              text_field: custom.translation_en
      # ST es->en: 125.0 h (25,833.3 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: es
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: es
              tgt_lang: en
              text_field: custom.translation_en
      # ST it->en: 125.0 h (6,024.7 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: it
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: it
              tgt_lang: en
              text_field: custom.translation_en
      # ST en->de: 125.0 h (429.9 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: en
          tgt_lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/en_de/train
            weight: 1.00000000
            tags:
              task: st
              src_lang: en
              tgt_lang: de
    # Stats
    # total_hours is overwritten by infra/compute_mix_weights.py from its own
    # measurement; total_cuts is not (see docs/mixture_weights.md), so it is
    # maintained here. Both count the 22 yodas-granary ast leaves twice, once
    # per task, because the mixture draws from each of those leaves twice.
    total_hours: 1250.00
    total_cuts: 120949122
    force_estimate: false

    # Duration filtering
    min_duration: 0.5
    max_duration: 90.0
    
    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    # 120 s, up from 90: measured +52% throughput on artemis (2x H100,
    # job 327902 vs 327899).  The other ABL configs already run at 480 s
    # and are NOT covered by that measurement -- do not copy 120 onto them.
    batch_duration: 120  # seconds of audio per batch
    quadratic_duration: 30 # see https://lhotse.readthedocs.io/en/latest/datasets.html#lhotse.dataset.sampling.TimeConstraint

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    # Raised from 10000 after throughput benchmarking on artemis (2x H100,
    # 300 steps each, one knob per job -- jobs 327899/327913).  buffer_size is
    # the DynamicBucketingSampler pool; it trades I/O locality for batch
    # diversity, and the cost is real: 10000 ran 1.74x slower per step than
    # 2000, plus a one-time fill of ~460 s vs ~47 s.  Cross-dataset and
    # cross-language mixing comes from CutSet.mux *upstream* of this buffer, so
    # this knob only controls local reordering; past roughly 30-50x the batch
    # size per bucket it buys nothing measurable.  50000 keeps a wide pool
    # (~1600 cuts/bucket) while staying far from the regime where the fill cost
    # is measured in hours.
    buffer_size: 50000
    bucket_duration_bins: [2.6, 4.0, 5.0, 6.0, 7.02, 8.18, 9.54, 10.56, 11.38, 12.16, 12.94, 13.68, 14.41, 15.14, 15.86, 16.59, 17.32, 18.05, 18.81, 19.58, 21.18, 23.78, 26.32, 28.9, 33.18, 35.62, 36.98, 38.08, 39.08]

    # Sampling
    shuffle: true
    drop_last: false
    # Stage 2 deliberately draws a different slice of each source than stage 1
    # (MA) did. Both stages stream the same corpora, so reusing seed 42 would
    # replay much of the audio the model has already seen. NOTE: the launcher
    # overrides shard_seed from $MELT_SEED, so pass MELT_SEED=1337 at submit
    # time -- the value below is only what a bare `python train.py` would use.
    seed: 1337
    # A fixed scalar, not 'randomized': with indexed sources the partitioning
    # already separates the per-(rank, worker) streams, and the loader ignores
    # 'randomized' and falls back to `seed` with a warning anyway.
    shard_seed: 1337

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    # Generation-based evaluation costs ~N sequential decoder steps per sample
    # instead of a single forward, so the full validation set is not affordable.
    #
    # NOTE this cap is applied PER NAMED EVAL SET, not per config: here
    # 5 named eval sets x 200 = ~1000 utterances per eval.
    #
    # Measured on an H100 (artemis job 327830): ~2.2 s/utterance at
    # generation_max_length 64, and the cost is roughly linear in the token
    # budget because nothing in the training targets teaches the model to stop
    # (see docs/generation_eval.md) -- so every sample spends the whole budget.
    # Budget the eval against eval_steps before raising either number.
    #
    # materialize_cuts_for_eval applies the cap with a seeded shuffle, so every
    # run scores the same subset.
    max_samples: 200
    input_cfg:
      # ASR en validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.metadata.sentence
        # 27.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/dev
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 15.8 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR de validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.metadata.sentence
        # 2.5 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/dev
        tags:
          task: asr
          lang: de
          text_field: custom.pnc_text
        # 14.3 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR fr validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/validation
        tags:
          task: asr
          lang: fr
          text_field: custom.metadata.sentence
        # 24.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/dev
        tags:
          task: asr
          lang: fr
          text_field: custom.pnc_text
        # 10.1 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/validation
        tags:
          task: asr
          lang: fr
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR es validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.metadata.sentence
        # 26.8 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/dev
        tags:
          task: asr
          lang: es
          text_field: custom.pnc_text
        # 10.0 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.pnc_text
        # 5.1 h of voxpopuli (validation split)
      # ASR it validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.metadata.sentence
        # 25.4 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/dev
        tags:
          task: asr
          lang: it
          text_field: custom.pnc_text
        # 5.2 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.pnc_text
        # 4.5 h of voxpopuli (validation split)
      # ST en->de validation (dev split): 26.0 h. No X->en probe: yodas-granary's `ast` sets have no held-out split.
      - type: lhotse_shar
        name: st_en_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/en_de/dev
        tags:
          task: st
          src_lang: en
          tgt_lang: de
    # Statistics
    total_hours: 212.08
    total_cuts: 101728  # measured by infra/check_training_config.py (H3)
    force_estimate: true

    # data.strict_text_field is not inherited by eval (resolve_eval_data_config
    # only carries apply_chat_template/prompt_template/*/chat_template_config,
    # dataloader.py:1226-1231), so it is set explicitly here to match training.
    strict_text_field: true

    # Batch composition
    batch_size: 16
    batch_duration: null

    buffer_size: 20000
    shuffle: false
    drop_last: true
    min_duration: 0.5
    max_duration: 120.0
    num_workers: 0
    pin_memory: true
    prefetch_factor: null
    sample_rate: 16000
    text_field: text
    lang_field: lang

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 1337
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse, set to 1
  # Eval does NOT go through Lhotse — it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule
  lr_scheduler_type: cosine
  warmup_steps: 20

  # Duration
  # One pass over the 1250 h mixture = 125 h per group (5 ASR languages +
  # 5 ST directions), which is the stage-2 budget. max_steps is set rather
  # than derived: the epoch estimate is computed from the config's (stale)
  # total_cuts and is unreliable -- see issue #46.
  #
  #   max_steps = total_hours * 3600 / (batch_duration * world_size * grad_accum)
  #             = 1250 * 3600 / (120 * 2 * 4) = 4687.5 -> 4688
  #
  # This is the nominal figure. Measured throughput on the MA run was lower
  # (~0.15 h/step against the 0.27 h/step this formula assumes), so confirm
  # the real exposure against the train_hours/* series in W&B and extend
  # max_steps if 125 h per group is meant to be reached exactly.
  num_train_epochs: 1
  max_steps: 4688

  # Logging
  logging_strategy: steps
  logging_steps: 5
  report_to: wandb

  # Evaluation
  eval_strategy: steps # "no" # steps
  eval_steps: 100
  batch_eval_metrics: true

  # Evaluation decodes with generate() -- greedy, at most this many *new*
  # tokens (MELT's prompt is audio, so generation_max_length is read as a
  # new-token budget; see MELTTrainer._generation_kwargs).
  predict_with_generate: true
  generation_max_length: 256
  generation_num_beams: 1

  # Checkpointing
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 5

  # Performance
  bf16: true
  group_by_length: false
  dataloader_num_workers: 4  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true
  # Reference/hypothesis pairs printed to stdout and logged to W&B each eval.
  # 0 disables.
  log_num_samples: 10

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95
  encoder_lr: 6e-6
  decoder_lr: 2e-5
  adapter_lr: 2e-4
  min_lr_scale: 0.1
