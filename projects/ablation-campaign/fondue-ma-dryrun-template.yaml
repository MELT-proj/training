      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/train
        tags: { task: asr, lang: en, text_field: custom.metadata.sentence }
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/train
        tags: { task: asr, lang: en, text_field: custom.pnc_text }
