        tags: { task: asr, lang: en }
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/fleurs/en_us/train
        tags: { task: asr, lang: en, text_field: custom.pnc_text }
      - type: lhotse_shar
