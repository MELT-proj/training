# Online self-distillation (AZeroS-style, on-policy) on the MA data.
#
# Run with melt.training.train_self_distill (launch_self_distill.sh sets it),
# never with melt.training.train: this file is an overlay, and only the
# self-distillation entrypoint layers it over base_config. See
# docs/self_distillation.md for the method.
#
# Everything except the objective matches MA-700-screen-w2vb-lr2e3-b300-evalfrozen
# in campaign.yaml, so the two arms differ only in the training target:
# same data, same filters, same frozen encoder/decoder, same MLP adapter at
# 10 Hz, same LR schedule. batch_duration x grad_accum (75 x 1 x 4 ranks) is
# passed on the CLI by the launcher, as plan_arm.py does for that arm.
base_config: ABL-MA-700-asr.yaml

run:
  exp_name: SD-700asr
  # The preallocation pass builds a gold-transcript batch and backpropagates
  # through the standard forward, not through rollout + student + teacher.
  # Its peak would be a number for a different step, so the trainer refuses it.
  memory_preallocation: false

model:
  encoder:
    eval_when_frozen: true
  adapter:
    stack_factor: 5

data:
  validation_ds:
    # In-training WER needs a transcription instruction for this method: an
    # instruction-free model *answers* the utterance, it does not transcribe it.
    # The phrasing is AZeroS's own SIT_s instruction. Training keeps the
    # instruction-free "{audio_token}" prompt inherited from data.prompt_template,
    # and so does the eval alignment gap (eval_loss).
    prompt_template: "{audio_token} Repeat the above content."

trainer:
  lr_scheduler_type: warmup_stable_decay
  # num_decay_steps = 20% of the reference arm's derived 42000 steps. A run with
  # a different step budget must override this with its own 20%.
  lr_scheduler_kwargs:
    num_decay_steps: 8400
    min_lr_ratio: 0.1
    decay_type: cosine
  # A float is a ratio of the total steps in transformers 5.
  warmup_steps: 0.03
  eval_steps: 3818
  save_steps: 3818
  save_total_limit: 2

optimization:
  adapter_lr: 2e-3

# Every key is stated, so the launcher can name the run from this file alone.
distill:
  # Probability of a student (on-policy) rollout; 0 = teacher rollouts only.
  lmbda: 1.0
  # jsd: TRL generalized JSD over the full vocabulary. ce: hard labels, lmbda 0 only.
  loss: jsd
  # 0 = forward KL(teacher || student), 1 = reverse KL(student || teacher).
  beta: 1.0
  max_new_tokens: 256
  temperature: 1.0
  top_p: 1.0
  eval_alignment_gap: true
