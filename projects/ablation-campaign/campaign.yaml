  # --- The audio-stack crossing (03-audio-stack.md Sec2; recipe decided PI, ---
  # 2026-09-26) -- 4 encoders x 4 adapters, one recipe, every arm at 10 Hz via
  # frame_rate_hz (derives stack_factor for mlp/moe, stride+kernel for
  # conformer, and checks the q-former's own window/downsample rate). Each arm
  # trains on ABL-MA-2100-asr.yaml: 2,100 h per language, 10,500 h in total,
  # counted in hours rather than epochs (PI, 2026-10-02/10-07), so the rows
  # carry no `epochs:`. These are new ids (MA-2100-*): the earlier
  # MA-700-crossing-* five-epoch runs used a different recipe and no warmup,
  # and their outputs are not to be ranked next to these. max_steps and time:
  # below were set on 2026-10-08 (see the last paragraph of this comment).
  # warmup_ratio: 0.03 now takes effect (plan_arm emits it as a fractional
  # warmup_steps; transformers 5 had been dropping `warmup_ratio`).
  #
  # eval_when_frozen: true on the 12 non-Whisper cells (PI, 2026-09-28), after
  # the A/B on w2v-BERT (job 46703807, board 2026-09-28) came back mixed, not
  # a clean win -- ID CER improves (-0.0516) but OOD-train FLEURS worsens
  # badly (+0.1249, weight 1.5x), netting a score regression (0.7149 ->
  # 0.7587). PI decided to apply it anyway to all three encoders that share
  # the live layerdrop-0.1 mechanism (w2v-BERT, MMS-1b, mHuBERT-147) rather
  # than split the crossing's read-out by flag value. Whisper is unaffected
  # either way (structural no-op, zero layerdrop/dropout) and its 4 cells
  # already ran without the flag -- not re-run, since it provably does not
  # change their result (`frozen_encoder_train_mode.py`, board 2026-09-26:
  # cos 1.0000, relative L2 0.0000 for Whisper specifically).
  #
  # nodes: and the first time: values (2026-09-28; time: was re-derived on
  # 2026-10-08, see the last paragraph): three bands, from the five measured
  # smokes plus the two existing w2v-bert/whisper +mlp screen runs (rescaled x5
  # for epochs), extrapolated to the other nine cells by an encoder-multiplier
  # x adapter-multiplier model (full table on the board):
  #   - most rows: the estimate +30% margin, matching this file's own
  #     existing margin convention (the screen's 300s corner: 16h budget on
  #     ~10.3h measured);
  #   - a few land within the 30% of acc_ehpc's 72h/3-day cap, so they are
  #     capped at 72h exactly instead (less margin, but still one-shot);
  #   - seven rows -- every Q-Former cell, plus the two next-most-expensive
  #     Conformer cells and one MoE cell -- had a raw estimate ABOVE 72h at
  #     the recipe's world_size (1 node, 4 ranks). PI decision (2026-09-28):
  #     add nodes for just these seven, not for the other nine, per the
  #     measured "keep grad_accum fixed, add nodes: GPU-h flat, wall halves
  #     per doubling" scaling (infrastructure.md Sec4, measured for IFT, not
  #     yet for MA -- treat the halving below as extrapolated until the
  #     first of these seven lands and a real s/step number replaces it).
  #     Six go to nodes: 2 (world_size 8); mhubert-qformer's raw estimate
  #     (146h) still cleared 72h at nodes: 2 (~73h), so it alone goes to
  #     nodes: 4 (world_size 16). Same +30%-margin / 72h-cap convention as
  #     above, applied to the halved (or quartered) raw estimate.
  #
  # max_steps and time: (2026-10-08). The step estimate behind the derived step
  # count assumes full batches; the 1,500-step smoke of this config measured
  # 79.9% (239.7 s of the 300 s nominal per step), so each row states 1.25x the
  # estimate -- 157,500 / 78,750 / 39,375 steps at 4 / 8 / 16 ranks -- which
  # trains about the budgeted 10,500 h. time: is the projected wall time + 30%
  # (the margin above): 0.88 s/step measured on the w2v-BERT + MLP cell, scaled
  # to the other cells by their 700 h long-run rates, plus 0.8 h of fixed
  # overhead per job. A row keeps its earlier value when that already gives
  # 30%. The 2- and 4-node cells are scaled the same way and are not measured
  # on this data (board 2026-10-08).
  #
  # adapter_lr (2026-10-09): 2e-3, the w2v-BERT + MLP screen's best point, for
