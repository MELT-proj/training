# The ablation campaign's INTENT: every arm we mean to run, as axis values.
#
# This file is the input, not a log. `campaign.py status` joins it against
# reality (SLURM + the output dirs) to answer "what has run, what is running,
# what is missing". Adding an ablation means adding a row here, reviewed in a
# PR -- not typing a submit command.
#
# What belongs where (see README.md's "The three axes"):
#   - a new data mixture / budget / task set -> a new ABL-*.yaml, referenced
#     by `config:` below
#   - a new architecture or LR point         -> a row here
#   - anything that must be identical across arms (quadratic_duration,
#     max_samples, max_duration/max_tokens) -> the base YAML, never here
#   - batch_duration/grad_accum_steps default to the base YAML too, and
#     should stay there for arms that can run at the config's own value --
#     but plan_arm.py DOES accept them as a per-arm override (a coupled
#     pair: their product with world_size sets audio-seconds/step, so
#     overriding one means compensating the other to keep steps/epoch, and
#     therefore comparability with sibling arms, unchanged). This exists for
#     memory-constrained cases like a decoder that only fits DDP at a
#     smaller batch_duration -- see MA-700-qwen35-2b-base below for a worked
#     example and plan_arm.py's ArmAxes for the mechanics.
#   - gradient_checkpointing is a plain per-arm override too, but an
#     independent one (no compensation needed): it trades recompute for
#     activation memory without changing what a step trains on. DDP's only
#     route to activation checkpointing -- FSDP2 gets it from accelerate's
#     own fsdp_activation_checkpointing instead.
#
# Every field except `id`, `stage` and `config` is optional and falls back to
# `defaults:` and then to the base config's own value. An omitted axis means
# "inherit whatever the config declares" -- it never guesses.

defaults:
  site: mn5
  accelerate: config/accelerate/ddp.yaml
  nodes: 2
  gpus_per_node: 4          # -> world_size 8. Pinned, never autodetected: MN5
                            # allocates `acc` nodes whole so SLURM_GPUS_ON_NODE
                            # reports the node's full count (PR #90).
  qos: acc_ehpc
  eval_rounds: 11           # eval_steps = round(steps / eval_rounds)
  keep_checkpoints: 2       # save_total_limit

# `time:` policy (revised 2026-09-02): size each arm's wall time to cover its
# WHOLE run in one allocation, not one chunk of it. A node failure's cost is
# bounded by the checkpoint interval (`checkpoint_count`/`keep_checkpoints`),
# not by how long the allocation is -- a 20 h request that fails at hour 19
# loses one checkpoint interval, same as a 6 h request that fails at hour 5.
# So a longer allocation does not raise the cost of a failure; it only removes
# the toil of manually `--resume`-ing every few hours in the normal case.
# `sbatch --test-only` across a wide range of node counts/wall times showed no
# scheduling penalty for asking for more (2026-09-02), though check that
# still holds if the cluster is more loaded. `time:` should be a real,
# measured-or-reasoned estimate per arm -- MA arms finish in well under an
# hour (adapter-only, frozen decoder) so their existing 6-8h defaults were
# already one-shot; IFT arms train the full decoder and need sizing per
# decoder. See README.md's "Stage 2 -- IFT-700" section for the Llama
# numbers this was derived from (5.73 s/step measured, 2 nodes, grad_accum 4).

arms:
  # ---------------------------------------------------------------- MA (stage 1)
  - id: MA-700-llama1b-ins
    stage: MA
    config: ABL-MA-700-asr.yaml
    seed: 42
    time: "06:00:00"
    # The `-md60` suffix marks the re-run at max_duration 60 / max_tokens 400.
    # The first attempt filtered at an unintended max_duration 30; its
    # directory (same name without the suffix) is left in place and must NOT
    # be reused -- pointing a run at it would resume from its checkpoint-2188
    # rather than train from scratch. See README.md's "max_duration /
    # max_tokens" section.
    exp_name: MA-700asr-w2vbF-llama1bInsF-mlpT-s42-8g-md60

  - id: MA-700-verbatim-llama1b-ins
    stage: MA
    config: ABL-MA-700-asr.yaml     # same ASR mixture/bins/budget as
                                    # MA-700-llama1b-ins -- only the prompt
                                    # STYLE changes, via template_task_override
                                    # below. tags.task stays "asr" (unchanged
                                    # data/eval-set identity and per-task
                                    # WER/CER grouping); only which
                                    # TASK_TEMPLATES bucket gets drawn from
                                    # changes. See melt/training/data/audio/
                                    # lhotse/helpers.py's TASK_TEMPLATES and
                                    # plan_arm.py's ArmAxes.template_task_override.
    template_task_override: verbatim
    epochs: 3
    seed: 42
    # 3x MA-700-llama1b-ins's own "06:00:00" (measured comfortably covering
    # one epoch of this same config) minus one epoch's worth of the startup
    # overhead that only happens once per job, then rounded up for margin.
    # Unmeasured for 3 epochs specifically -- check the first run's actual
    # rate before trusting this on a resume.
    time: "18:00:00"

  - id: MA-700-llama1b-base
    stage: MA
    config: ABL-MA-700-asr.yaml     # deliberately the SAME config as the
                                    # Instruct arm: same mixture, bins, step
                                    # budget and prompt, so a difference
                                    # between them is attributable to the
                                    # backbone alone.
    decoder: meta-llama/Llama-3.2-1B
    seed: 42
    time: "06:00:00"
    exp_name: MA-700asr-w2vbF-llama1bBaseF-mlpT-s42-8g-md60

  - id: MA-700-qwen35-2b-ins
    stage: MA
    config: ABL-MA-700-asr.yaml     # same config as the Llama pair, for the
                                    # same reason: identical mixture/bins/
                                    # budget/prompt across every 700 h arm.
    decoder: Qwen/Qwen3.5-2B
    batch_duration: 30
    grad_accum_steps: 20
    gradient_checkpointing: false
    seed: 42
    checkpoint_count: 2
    time: "28:00:00"

  - id: MA-700-qwen35-2b-base
    stage: MA
    config: ABL-MA-700-asr.yaml     # same config as the Llama pair and the
                                    # Instruct sibling -- batch_duration/
                                    # grad_accum_steps below override two of
                                    # its values per-arm rather than forking
                                    # the file, but the data/mixture/budget
                                    # stay identical.
    decoder: Qwen/Qwen3.5-2B-Base
    batch_duration: 30
    grad_accum_steps: 20
    gradient_checkpointing: false
    seed: 42
    checkpoint_count: 2
    time: "28:00:00"

  # ------------------------------------------------- LibriSpeech step 0 (MA)
  # plan/01-interface-recipe.md §2: is the August recipe (adapter LR 2e-5,
  # effective batch 4800 s) or its step budget why the multilingual MA arms
  # never leave the "fluent but unrelated to audio" plateau? L1 is the
  # control; L2 isolates LR; L3 adds 4x the optimizer steps at the same LR;
  # L4 pushes LR further at L3's step budget. L5 (second seed of the best of
  # L2-L4) is added once that winner is known -- see the interpretation rules
  # in the plan file. ~7 GPU-h each at the measured MA rate (~1,000
  # audio-s/wall-s on 8 GPUs) for one ~961 h epoch.
  - id: MA-librispeech-l1
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 2e-5      # the August recipe, as control (== config default)
    seed: 42
    time: "02:00:00"

  - id: MA-librispeech-l2
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 2e-4      # LR alone, same 4800 s effective batch as L1
    seed: 42
    time: "02:00:00"

  - id: MA-librispeech-l3
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 2e-4      # LR plus 4x more optimizer steps than L1/L2
    grad_accum_steps: 1   # batch_duration 150 x 1 x 8 = 1200 s effective batch
    seed: 42
    time: "02:00:00"

  - id: MA-librispeech-l4
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 1e-3      # upper end of the LR range, L3's step budget
    grad_accum_steps: 1   # 1200 s effective batch, same as L3
    seed: 42
    time: "02:00:00"

  # L5: second seed of the best of L2-L4. Measured (dev-clean, final epoch):
  # L1 loss 3.072/WER 1.12, L2 loss 3.012/WER 1.084, L3 loss 2.943/WER 1.076,
  # L4 loss 2.625/WER 1.04 -- L4 wins clearly and was still declining fastest
  # at epoch end, so it is the noise check.
  - id: MA-librispeech-l5
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 1e-3
    grad_accum_steps: 1
    seed: 43
    time: "02:00:00"

  # Diagnostic, not a campaign comparison point: L4's loss delta accelerated
  # through the back half of its one epoch (-0.03/step early -> -0.108 near
  # epoch 0.8) before flattening in the last ~10% -- consistent with the
  # SLAM-ASR plateau-then-drop caught mid-transition, not a dead recipe. A
  # fresh 3-epoch run at L4's LR/batch re-derives the cosine schedule over
  # the full 3-epoch horizon, so LR stays higher for longer through exactly
  # the region L4 showed acceleration in, testing "does it just need more
  # gradient updates" without confounding decoder/encoder capacity or data
  # volume. ~21-24 GPU-h (3x L4). Deliberately breaks the one-epoch
  # convention (agent-protocol.md §3) via the documented `--` passthrough,
  # not a new campaign axis -- submit as:
  #   campaign.py run MA-librispeech-l4-ep3 -- --trainer.num_train_epochs 3
  # eval_steps/save_steps stay at the single-epoch cadence (262), so this
  # evaluates ~3x more often than a normal arm; harmless at this scale.
  # New seed (44, continuing l1-l4's 42 / l5's 43) so the composed exp_name
  # cannot collide with l4's already-completed run directory.
  - id: MA-librispeech-l4-ep3
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 1e-3
    grad_accum_steps: 1
    seed: 44
    time: "03:00:00"

  # -------------------------------------------------- Step 0b (01-interface-recipe.md sec2b)
  # Common to all of R/R-seed/R-lr2e3/R-b600/R-k5/W: adapter LR 1e-3, three
  # epochs, warmup-stable-decay (num_decay_steps = round(0.2 x each arm's
  # own derived steps) -- differs by arm since R-b600 halves world_size and
  # doubles steps, so it is passed as a per-submission `--` override, not
  # baked into these rows), min_lr_ratio 0.1, decay_type cosine, and eval
  # max_samples 500/set (200 made the epoch-3 trajectory noisy). All via the
  # same `--` passthrough l4-ep3 uses, not new campaign axes:
  #   campaign.py run MA-librispeech-r -- --trainer.num_train_epochs 3 \
  #     --data.validation_ds.max_samples 500 \
  #     --trainer.lr_scheduler_type warmup_stable_decay \
  #     --trainer.lr_scheduler_kwargs '{"num_decay_steps": N, "min_lr_ratio": 0.1, "decay_type": "cosine"}'
  # `time:` on R/R-seed/R-lr2e3/R-k5 bumped 03:00:00 -> 04:00:00 (2026-09-18):
  # the eval max_samples bump from l4-ep3's 200 to 500/set adds enough
  # per-round generation cost that all four hit the 3h wall clock at ~87%
  # (jobs 45985909/24/30/44) and needed `--resume`. No change needed to
  # R-b600 (8h, ~2x steps but comfortable margin observed) or W (6h, not
  # yet a binding constraint).
  # A0 (schedule reference) is MA-librispeech-l4-ep3 above -- not rerun.
  - id: MA-librispeech-r
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 1e-3
    grad_accum_steps: 1   # 1200 s effective batch, same as l4-ep3/A0
    seed: 45
    time: "04:00:00"

  - id: MA-librispeech-r-seed
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 1e-3
    grad_accum_steps: 1
    seed: 46              # noise check against MA-librispeech-r (seed 45)
    time: "04:00:00"

  - id: MA-librispeech-r-lr2e3
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 2e-3      # R's peak LR pushed further
    grad_accum_steps: 1
    seed: 47
    time: "04:00:00"

  - id: MA-librispeech-r-b600
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 1e-3
    grad_accum_steps: 1   # batch_duration 150 x 1 x 4 = 600 s effective batch
    nodes: 1
    gpus_per_node: 4      # world_size 4, half of R's 8 -> ~2x the steps
    seed: 48
    time: "08:00:00"

  - id: MA-librispeech-r-k5
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 1e-3
    grad_accum_steps: 1
    stack_factor: 5        # 50 Hz -> 10 Hz, as SLAM-ASR does
    seed: 49
    time: "04:00:00"

  - id: MA-librispeech-w
    stage: MA
    config: ABL-MA-librispeech.yaml
    adapter_lr: 1e-3
    grad_accum_steps: 1
    encoder: openai/whisper-large-v3   # supervised-ASR encoder control, stack 1 (default)
    seed: 50
    time: "06:00:00"       # Whisper pads every cut to its fixed 30 s window, slower per step
    # Job 45985946 (2026-09-18) failed at startup: Whisper-large-v3 only
    # accepts exactly 3000 frames (its fixed 30 s window), not the
    # w2v-BERT-tuned model.encoder.max_audio_seq_len default of 1500 --
    # there is no campaign axis for this yet, so every submission of this
    # arm (and any future Whisper arm in 03-audio-stack.md's crossing)
    # needs `-- --model.encoder.max_audio_seq_len 3000` passed explicitly.
    # Resubmitted as job 46050285 with it.

  # Decoder-size control, gated on PR #132 (merged 2026-09-17: Qwen chat-
  # formatted decoders never stopped generation) plus Qwen/Qwen3.5-4B staged
  # to MN5 and a DECODER_PROFILES entry for it (plan_arm.py, added
  # 2026-09-17, verified against the real tokenizer -- same vocab as the 2B,
  # <|text_pad|> equally absent). Same batch_duration 30 the existing
  # MA-700-qwen35-2b-ins arm needed for a frozen Qwen3.5-2B decoder under
  # DDP (campaign.yaml, above); grad_accum_steps 5 instead of that arm's 20
  # gives 30 x 5 x 8 = 1200 s effective batch, matching R. stack_factor 5 is
  # what makes the 4B affordable at all (see the sec2b comment on
  # MA-librispeech-r-k5) -- read size only from Q4-k5 against Q2-k5, since
  # Llama-vs-Qwen already confounds size with family/attention type.
  - id: MA-librispeech-q2-k5
    stage: MA
    config: ABL-MA-librispeech.yaml
    decoder: Qwen/Qwen3.5-2B
    adapter_lr: 1e-3
    batch_duration: 30
    grad_accum_steps: 5    # 30 x 5 x 8 = 1200 s effective batch
    gradient_checkpointing: false
    stack_factor: 5
    seed: 51
    time: "04:00:00"

  - id: MA-librispeech-q4-k5
    stage: MA
    config: ABL-MA-librispeech.yaml
    decoder: Qwen/Qwen3.5-4B
    adapter_lr: 1e-3
    batch_duration: 30
    grad_accum_steps: 5
    gradient_checkpointing: false
    stack_factor: 5
    seed: 52
    time: "05:00:00"       # ~2x the 2B's decoder; wider margin until measured

  # Seed replicate of Q4-k5, requested by the Orchestrator 2026-09-19: the
  # 2B->4B gap (0.065 dev-clean, 0.073 dev-other) is not yet quotable
  # against a single seed per arm -- same trap as the LR 2e-3 contrast.
  # This also settles whether Q4-k5's 10.36% dev-clean (0.36 pts over the
  # <10% bar) is itself a seed draw. Identical to Q4-k5 in every other
  # axis; total elapsed compute across Q4-k5's two submissions was
  # ~11h -- budgeted higher here to avoid a second TIMEOUT/resume cycle.
  - id: MA-librispeech-q4-k5-seed2
    stage: MA
    config: ABL-MA-librispeech.yaml
    decoder: Qwen/Qwen3.5-4B
    adapter_lr: 1e-3
    batch_duration: 30
    grad_accum_steps: 5
    gradient_checkpointing: false
    stack_factor: 5
    seed: 53
    time: "12:00:00"

  # --------------------------------------------------------------- IFT (stage 2)
  - id: IFT-700-llama1b-ins
    stage: IFT
    config: ABL-IFT-700.yaml
    init_from: MA-700-llama1b-ins
    seed: 1337
    batch_duration: 30
    grad_accum_steps: 20
    gradient_checkpointing: false
    time: "20:00:00"
    # 6 intermediate checkpoints plus the training-end one, evenly spaced:
    # at 700 h/language that is a checkpoint roughly every 100 h/language
    # (~1.4h of wall clock at the measured rate) -- this is also what bounds
    # a node failure's cost regardless of the allocation length above.
    checkpoint_count: 7
    exp_name: IFT-700both-w2vbF-llama1bInsT-mlpF-s1337-8g

  - id: IFT-700-llama1b-base
    stage: IFT
    config: ABL-IFT-700.yaml
    decoder: meta-llama/Llama-3.2-1B    # ABL-IFT-700.yaml bakes in the
                                        # Instruct sibling; must diverge here.
                                        # See DECODER_PROFILES in plan_arm.py:
                                        # this triggers chat_template_from ->
                                        # meta-llama/Llama-3.2-1B-Instruct,
                                        # since the Base checkpoint ships no
                                        # chat template of its own.
    init_from: MA-700-llama1b-base
    seed: 1337
    batch_duration: 30
    grad_accum_steps: 20
    gradient_checkpointing: false
    time: "20:00:00"
    checkpoint_count: 7               # same cadence as IFT-700-llama1b-ins

  - id: IFT-700-qwen35-2b-ins
    stage: IFT
    config: ABL-IFT-700.yaml
    decoder: Qwen/Qwen3.5-2B          # ABL-IFT-700.yaml bakes in Llama, unlike
                                      # the MA config's silent inherit -- must
                                      # be explicit here too.
    init_from: MA-700-qwen35-2b-ins
    seed: 1337
    time: "46:00:00"
    batch_duration: 30
    grad_accum_steps: 20
    # true: false OOM'd at step 1 (full-decoder DDP has no optimizer-state
    # sharding, unlike the adapter-only MA arm); batch_duration/grad_accum_steps
    # retuning doesn't help since a single max_duration cut alone nears the
    # ceiling. Keeps DDP over FSDP2 for speed, per README's memory-lever notes.
    gradient_checkpointing: true
    checkpoint_count: 7               # same cadence as IFT-700-llama1b-ins

  - id: IFT-700-qwen35-2b-base
    stage: IFT
    config: ABL-IFT-700.yaml
    # Same two `campaign.py plan` messages as IFT-700-qwen35-2b-ins, for the
    # same reason (see that row's comments): a chat_template_config
    # 'llama3' -> 'chatml' WARNING (decoder-driven, confirmed wanted) and a
    # model.ckpt NOTE overriding ABL-IFT-700.yaml's baked Llama default to
    # this arm's own init_from target below.
    decoder: Qwen/Qwen3.5-2B-Base
    init_from: MA-700-qwen35-2b-base
    seed: 1337
    batch_duration: 30
    grad_accum_steps: 20
    gradient_checkpointing: false
    time: "46:00:00"
    checkpoint_count: 7

  # --- Week 2: the five-language interface screen, LR x batch grid ----------
  #
  # plan/01-interface-recipe.md §3. Twelve arms: adapter LR {1e-3, 2e-3} x
  # effective batch {1200, 600, 300} s x encoder {w2v-BERT 2.0, Whisper-
  # large-v3}, all at stack_factor 5 (10 Hz) on ABL-MA-700-asr.yaml, one epoch
  # of 700 h per language.
  #
  # Why both encoders. The screen has to resolve LR and batch contrasts, and
  # step 0b measured those at 0.112/0.065 (LR) and 0.148/0.121 (batch) on
  # dev-clean/dev-other against a seed-only spread of 0.108/0.002 at the same
  # error regime -- so on dev-clean the LR contrast is the size of the noise.
  # w2v-BERT's best step-0b arm sat at WER 0.314 on easier data than this
  # mixture; Whisper sat at 0.038, where the measured spread is 0.002. Running
  # the grid on w2v-BERT alone risks a screen that cannot answer its own
  # question. Running it on Whisper alone is the selection bias §2b warns
  # about. Running both costs ~120 GPU-h more and tests whether the recipe
  # optimum is encoder-invariant -- which 03-audio-stack.md's crossing already
  # ASSUMES when it fixes "one recipe for all sixteen" arms.
  #
  # Why grad_accum_steps is set on every row. ABL-MA-700-asr.yaml's own
  # batch_duration 150 x grad_accum 4 x 8 ranks is 4800 s -- the August recipe,
  # diagnosed in §1 as the cause of the failed alignment and explicitly
  # dropped in §3. Inheriting it silently would re-run the thing this screen
  # exists to replace.
  #
  # Topology per batch level (batch_duration x grad_accum x world_size):
  #   1200 s  ->  150 x 1 x 8   (2 nodes; Whisper 75 x 2 x 8, see below)
  #    600 s  ->   75 x 1 x 8   (2 nodes)
  #    300 s  ->   75 x 1 x 4   (1 node)
  # The Whisper 1200 s arms halve batch_duration and double grad_accum to keep
  # the product: Whisper pads every cut to a whole 30 s window, so at ~5 s mean
  # utterance this mixture inflates its encoder input ~6x, against ~2.5x on
  # LibriSpeech where MA-librispeech-w ran at batch_duration 150. Same
  # effective batch, same steps/epoch, lower activation peak.
  # No max_audio_seq_len rows: plan_arm.py derives Whisper's 3000 from the
  # encoder name (ENCODER_WINDOW_FRAMES).
  #
  # Seed 42 on all twelve, per agent-protocol.md §3: step 0b drew a different
  # seed per arm, which is how a 0.11 contrast turned out to be a seed draw.
  # The seed replicates are their own arms, added once the best corner is known.

  - id: MA-700-screen-w2vb-lr1e3-b1200
    stage: MA
    config: ABL-MA-700-asr.yaml
    stack_factor: 5
    adapter_lr: 1e-3
    batch_duration: 150
    grad_accum_steps: 1
    seed: 42
    time: "08:00:00"

  - id: MA-700-screen-w2vb-lr1e3-b600
    stage: MA
    config: ABL-MA-700-asr.yaml
    stack_factor: 5
    adapter_lr: 1e-3
    batch_duration: 75
    grad_accum_steps: 1
    seed: 42
    time: "10:00:00"

  - id: MA-700-screen-w2vb-lr1e3-b300
    stage: MA
    config: ABL-MA-700-asr.yaml
    stack_factor: 5
    adapter_lr: 1e-3
    batch_duration: 75
    grad_accum_steps: 1
    nodes: 1                 # 75 x 1 x 4 = 300 s
    seed: 42
    time: "16:00:00"

  - id: MA-700-screen-w2vb-lr2e3-b1200
    stage: MA
    config: ABL-MA-700-asr.yaml
    stack_factor: 5
    adapter_lr: 2e-3
    batch_duration: 150
    grad_accum_steps: 1
    seed: 42
    time: "08:00:00"

  - id: MA-700-screen-w2vb-lr2e3-b600
    stage: MA
    config: ABL-MA-700-asr.yaml
    stack_factor: 5
    adapter_lr: 2e-3
    batch_duration: 75
    grad_accum_steps: 1
    seed: 42
    time: "10:00:00"

  - id: MA-700-screen-w2vb-lr2e3-b300
    stage: MA
    config: ABL-MA-700-asr.yaml
    stack_factor: 5
    adapter_lr: 2e-3
    batch_duration: 75
    grad_accum_steps: 1
    nodes: 1                 # 75 x 1 x 4 = 300 s
    seed: 42
    time: "16:00:00"

  - id: MA-700-screen-whisper-lr1e3-b1200
    stage: MA
    config: ABL-MA-700-asr.yaml
    encoder: openai/whisper-large-v3
    stack_factor: 5
    adapter_lr: 1e-3
    batch_duration: 75       # halved, grad_accum doubled: 75 x 2 x 8 = 1200 s
    grad_accum_steps: 2
    seed: 42
    time: "14:00:00"

  - id: MA-700-screen-whisper-lr1e3-b600
    stage: MA
    config: ABL-MA-700-asr.yaml
    encoder: openai/whisper-large-v3
    stack_factor: 5
