# ABL-IFT-700-backbone - ablation campaign, stage 2 (instruction fine-tuning)
# for the backbone study: ASR + ST at 700 h per language, initialised from the
# stage-1 arms MA-700-backbone-* (Whisper-large-v3 frozen + MoE adapter at 10 Hz,
# ABL-MA-700-whisper-asr.yaml). One config for all six decoders; campaign.yaml's
# IFT-700-backbone-* rows set the decoder, the batching and init_from.
#
# Rendered by build_campaign_config.py from config/train/SFT-v1.4.0.yaml with its
# train_ds max_duration set to 60 and quadratic_duration to null (so the bucket
# bins are measured at the cap the run uses; the template itself is unchanged):
#
#   python projects/ablation-campaign/build_campaign_config.py \
#     --template <SFT-v1.4.0.yaml, max_duration 60, quadratic_duration null> \
#     --datasets-root $LOCAL_DATASETS_DIR \
#     --cache projects/ablation-campaign/campaign_hours.json \
#     --bins-hist-cache infra/.config_check_cache.json \
#     --budget-hours 700 --tasks both --exclude-corpus fleurs \
#     --out projects/ablation-campaign/ABL-IFT-700-backbone.yaml
#
# Ten groups -- ASR for en/de/fr/es/it and ST for de/fr/es/it -> en plus the
# en -> de probe -- at 700 h each except en->de, which holds only 429.9 h and
# draws all of it (the group repeats, ~1.07 passes at the rows' max_steps).
# 6,729.9 h in all, over the language set of ABL-MA-700-whisper-asr.yaml.
# Weights are per-cut draw probabilities (--weights cuts, builder default), so
# the hours printed beside each source are the hours a run draws. This replaces
# ABL-IFT-700.yaml, whose hour-share weights over- and under-draw by source.
#
# THE STAGE SPLIT: encoder AND adapter are frozen, the DECODER is trained.
#
# Hand-applied on top of the render:
#
#   1. Encoder block: Whisper-large-v3 (window 3000 frames), spec-augment
#      pinned off as in the MA config. Adapter: moe, frozen. Both are inert
#      under model.ckpt (the architecture is read from the checkpoint) but kept
#      right in case the config is run without it.
#   2. Decoder block (Llama defaults; each row overrides decoder, tokens and
#      chat template from DECODER_PROFILES in plan_arm.py), apply_chat_template
#      true, one fixed prompt per task instead of a random TASK_TEMPLATES draw.
#   3. model.ckpt null: init_from in campaign.yaml names the MA arm. Under DDP
#      those checkpoints load pure bf16, so model.master_dtype: float32 is
#      REQUIRED here (see the comment at the key).
#   4. seed/shard_seed 1337, so stage 2 does not replay the cuts the MA arms
#      streamed with seed 42. The launcher takes the data seed from MELT_SEED.
#   5. max_duration 60 / max_tokens 400 as in stage 1, quadratic_duration null,
#      run.memory_preallocation true. batch_duration is set per row.
#   6. strict_text_field / skip_text_field_mismatch on train and validation.

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: ABL-IFT-700-backbone
  dry_run: false
  # Run one forward+backward at max_duration and one at min_duration before
  # step 1 and log peak CUDA memory for each. Stage 2 holds ~20 GB (Llama) to
  # ~37 GB (Qwen) more resident state than stage 1 did, so this is what turns "we might OOM at
  # step 4000" into a number printed in the first minute. Two extra passes,
  # once, and an OOM in them is caught and warned about rather than fatal.
  memory_preallocation: true

# =============================================================================
# Model Configuration
# =============================================================================
model:
  encoder:
    name: openai/whisper-large-v3
    freeze: true
    max_audio_seq_len: 3000 # Whisper's 30 s window, in 10 ms mel frames
    # Pinned off for every encoder, as in the MA config (plan/03-audio-stack.md
    # section 3). A no-op for Whisper.
    apply_spec_augment: false

  decoder:
    # Llama-3.2-1B-Instruct is the default; each campaign.yaml row names its own
    # decoder, tokens and chat template. While model.ckpt is set, `name` does not build the
    # model -- MELTConfig and the processor both come from the checkpoint --
    # but attn_implementation below IS read from here and pushed onto the
    # checkpoint's sub-config, so this block is not decorative. A checkpoint's
    # config.json records no attention implementation, and letting it fall back
    # to sdpa costs ~12x on generation (#86).
    name: meta-llama/Llama-3.2-1B-Instruct
    attn_implementation: flash_attention_2
    # THE stage-2 switch: the decoder trains here, the adapter does not.
    freeze: false
    eos_token: <|eot_id|>
    pad_token: <|finetune_right_pad_id|>
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>

  adapter:
    # Frozen here: stage 1 trained it, stage 2 tunes the decoder on top.
    freeze: true
    # What the stage-1 checkpoints were trained with. Inert while model.ckpt is
    # set (the architecture is read from the checkpoint).
    _type: moe

  # Set by `init_from` in campaign.yaml, which names the MA arm and resolves to
  # its run directory (never a checkpoint-N subdirectory: the tokenizer and
  # processor files live in the run root). MA runs on DDP, so that directory
  # holds consolidated weights and loads as-is.
  ckpt: null

  # fp32 master weights for the decoder this stage trains. A stage-1 run on DDP
  # under transformers 5 leaves a bf16 decoder and `dtype: bfloat16` in its
  # config.json; from_pretrained applies that to the WHOLE model and DDP does not
  # upcast, so without this key the decoder trains in pure bf16 and every AdamW
  # update below half a bf16 ulp of its weight is lost (at lr 2e-5 about 65% of
  # this decoder never moves). Every MA-700-backbone-* checkpoint is such a
  # checkpoint, so this key is REQUIRED here, and the memory figures in
  # campaign.yaml assume it (16 bytes per trainable parameter).
  master_dtype: float32

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000
  strict_text_field: true
  # A single malformed cut (missing custom.translation_en, yodas-granary/
  # French/ast) took down a whole distributed run at step 4080/6310 (an earlier
  # IFT, 2026-09) -- checked severity before enabling this: 1 cut of
  # 4,000 in its shard (0.03%), 0 of 80,000 sampled elsewhere in the same
  # source. Genuinely rare, not systematic, so skip-and-warn is the right
  # call here rather than raise-and-crash. See skip_text_field_mismatch's
  # own docstring (get_text_from_cut) for why this stays opt-in generally.
  skip_text_field_mismatch: true

  # -- Instruction formatting ----------------------------------------------
  # build_campaign_config.py writes `false` here unconditionally (it renders
  # modality-alignment configs and expects the run to override it). Stage 2
  # wants it on, so it is set in the file rather than on the command line.
  apply_chat_template: true

  # Llama 3's header format -- exactly what stage 1 rendered, so the special
  # tokens around the assistant turn are the ones this checkpoint was aligned
  # on. assistant_end is <|eot_id|> and the masking treats the boundaries as
  # inclusive, so <|eot_id|> is IN the loss: the model is taught to stop, and
  # the saved generation_config's eos_token_id list contains it (128009).
  chat_template_config: llama3

  # One fixed prompt per task rather than the default random draw over all
  # TASK_TEMPLATES entries, so instruction wording is a constant. These are the
  # first template listed for each task in
  # melt/training/data/audio/lhotse/helpers.py.
  #
  # NOTE this is the prompt difference between the stages: stage 1 trained on a
  # bare "{audio_token}" with no instruction, because modality alignment has
  # one task and no instruction to give. Stage 2 is where the instructions
  # arrive -- that is what "instruction fine-tuning" means here.
  #
  # {lang} resolves to the TARGET language for st (get_tags_from_cut collapses
  # `lang` to tgt_lang), so the st prompt reads "Translate this audio to
  # English." for the X->en directions and "... to German." for the en-de probe.
  prompt_template_selection: custom
  prompt_template:
    asr: "{audio_token} Transcribe this audio in {lang}."
    st: "{audio_token} Translate this audio to {lang}."

  train_ds:
    input_cfg:
      # `weight` is a per-CUT draw probability: lhotse's mux picks one cut per draw, so
      # a source's share of the audio is weight x its mean cut length. Each weight is the
      # share of the cuts that make up the hours listed beside it (hours / mean cut), so
      # those hours are what a run draws. build_campaign_config.py --weights cuts.
      # ASR en: 700.0 h, reference-matched mix -- 9.8% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.09843902
        tags:
          task: asr
          lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/train
            weight: 0.54426835
            tags:
              task: asr
              lang: en
              text_field: custom.metadata.sentence
            # 254.5 h of cv22_sidon, mean cut 5.7 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/train
            weight: 0.20207347
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 247.3 h of mls_sidon, mean cut 14.9 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/English/asr_only
            weight: 0.16165817
            tags:
              task: asr
              lang: en
            # 120.2 h of yodas-granary, mean cut 9.0 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/train
            weight: 0.09200001
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 78.0 h of voxpopuli, mean cut 10.3 s
      # ASR de: 700.0 h, reference-matched mix -- 11.7% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.11713333
        tags:
          task: asr
          lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/train
            weight: 0.45610274
            tags:
              task: asr
              lang: de
              text_field: custom.metadata.sentence
            # 254.5 h of cv22_sidon, mean cut 5.7 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/train
            weight: 0.16769063
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 247.3 h of mls_sidon, mean cut 15.1 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/asr_only
            weight: 0.28543580
            tags:
              task: asr
              lang: de
            # 120.2 h of yodas-granary, mean cut 4.3 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/train
            weight: 0.09077084
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 78.0 h of voxpopuli, mean cut 8.8 s
      # ASR fr: 700.0 h, reference-matched mix -- 11.9% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.11916973
        tags:
          task: asr
          lang: fr
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/train
            weight: 0.49490183
            tags:
              task: asr
              lang: fr
              text_field: custom.metadata.sentence
            # 254.5 h of cv22_sidon, mean cut 5.2 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/train
            weight: 0.16542702
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 247.3 h of mls_sidon, mean cut 15.0 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/asr_only
            weight: 0.26183945
            tags:
              task: asr
              lang: fr
            # 120.2 h of yodas-granary, mean cut 4.6 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/train
            weight: 0.07783169
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 78.0 h of voxpopuli, mean cut 10.1 s
      # ASR es: 700.0 h, reference-matched mix -- 13.6% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.13604855
        tags:
          task: asr
          lang: es
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/train
            weight: 0.43241568
            tags:
              task: asr
              lang: es
              text_field: custom.metadata.sentence
            # 254.5 h of cv22_sidon, mean cut 5.2 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/train
            weight: 0.14529744
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 247.3 h of mls_sidon, mean cut 15.0 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/asr_only
            weight: 0.35838890
            tags:
              task: asr
              lang: es
            # 120.2 h of yodas-granary, mean cut 2.9 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/train
            weight: 0.06389797
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 78.0 h of voxpopuli, mean cut 10.7 s
      # ASR it: 700.0 h, reference-matched mix -- 11.4% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.11350516
        tags:
          task: asr
          lang: it
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/train
            weight: 0.50591603
            tags:
              task: asr
              lang: it
              text_field: custom.metadata.sentence
            # 254.5 h of cv22_sidon, mean cut 5.3 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/train
            weight: 0.17453325
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 247.3 h of mls_sidon, mean cut 14.9 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/asr_only
            weight: 0.25346444
            tags:
              task: asr
              lang: it
            # 120.2 h of yodas-granary, mean cut 5.0 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/train
            weight: 0.06608628
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 78.0 h of voxpopuli, mean cut 12.4 s
      # ST de->en: 700.0 h (7,429.1 h available) -- 10.4% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.10446262
        tags:
          task: st
          src_lang: de
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: de
              tgt_lang: en
              text_field: custom.translation_en
      # ST fr->en: 700.0 h (11,511.7 h available) -- 9.6% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.09634260
        tags:
          task: st
          src_lang: fr
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: fr
              tgt_lang: en
              text_field: custom.translation_en
      # ST es->en: 700.0 h (25,833.3 h available) -- 7.1% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.07137213
        tags:
          task: st
          src_lang: es
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: es
              tgt_lang: en
              text_field: custom.translation_en
      # ST it->en: 700.0 h (6,024.7 h available) -- 4.7% of the cuts, 10.4% of the hours
      - type: group
        weight: 0.04737739
        tags:
          task: st
          src_lang: it
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: it
              tgt_lang: en
              text_field: custom.translation_en
      # ST en->de: 429.9 h (429.9 h available) -- 9.6% of the cuts, 6.4% of the hours
      - type: group
        weight: 0.09614948
        tags:
          task: st
          src_lang: en
          tgt_lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/en_de/train
            weight: 1.00000000
            tags:
              task: st
              src_lang: en
              tgt_lang: de
    # Stats
    # total_hours is the builder's sum of the groups' hours (what a run draws).
    total_hours: 6729.85
    total_cuts: 3000000       # ~, from the per-group hours and mean cut lengths (only read when batch_size is set)
    force_estimate: false

    # Duration filtering
    # 60 s, matching stage 1 -- both stages stream the same ASR corpora, so
    # filtering them differently would make a stage-to-stage comparison partly
    # about which cuts each one was allowed to see.
    #
    # Safe for the frozen adapter and encoder: stage 1 trained and ran at this
    # cap (Whisper works in 30 s windows).
    # Safe for memory: the decoder runs flash_attention_2, whose footprint is
    # linear in sequence length, so a single 60 s cut costs ~2x a 30 s cut in
    # decoder memory rather than ~4x. Compute still grows quadratically, which
    # is a throughput cost, not an OOM risk.
    min_duration: 0.5
    max_duration: 60.0

    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    # Set per row in campaign.yaml (the product batch_duration x grad_accum x
    # world_size is 4,800 audio-seconds per step, as the first IFT-700 arms).
    # 75 is the micro-batch the Llama and EuroLLM MA arms ran at on this encoder;
    # the trainable decoder adds fp32 gradients and AdamW moments (12 bytes per
    # parameter) and no activations. run.memory_preallocation checks the peak on
    # step 1.
    batch_duration: 75  # seconds of audio per batch
    # Deliberately unset, as in stage 1. lhotse charges each cut
    # `d + d^2/quadratic_duration`, so with it set batch_duration budgets
    # *effective* seconds and a "1 epoch" run silently covers less audio than
    # it claims -- the whole subject of #96. Unset, the charge is exactly `d`,
    # batch_duration means real audio seconds, and estimate_steps_per_epoch's
    # inflation factor is exactly 1.0, which is what makes the derived step
    # count the true number of batches.
    quadratic_duration: null

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    buffer_size: 10000
    # Measured on THIS draw (per-cut weights, ASR + ST) at the max_duration 60
    # cap with --bins-hist-cache. A stale set is an OOM, not a throughput
    # nuisance: RE-MEASURE THESE WHENEVER max_duration OR THE MIXTURE CHANGES.
    bucket_duration_bins: [2.62, 3.6, 4.2, 4.7, 5.14, 5.54, 5.96, 6.38, 6.86, 7.42, 8.14, 9.2, 10.5, 11.67, 12.8, 13.89, 14.96, 16.0, 17.06, 18.13, 19.22, 20.46, 23.44, 26.5, 29.64, 34.68, 36.76, 38.12, 39.1]

    # Drop cuts whose transcript is pathologically long for their audio.
    #
    # Batches are budgeted by *audio* seconds, so a cut with short audio and a
    # runaway transcript passes the duration constraint and still sets the
    # padded width of the whole batch. That ended an artemis run at
    # step 4292: 17 cuts, only 224 feature frames, but input_ids [17, 1158] and
    # 77.45 GB allocated on an 80 GB H100. Stage 1 ran without this filter
    # (max_tokens null) and got away with it; it is set here as intended.
    #
    # 400 removes only the tail: measured over an 800-cut head sample of all
    # train sources, p99 num_tokens is <=195 and the largest single value is
    # 291 (voxpopuli/de).
    #
    # Cuts without `custom.num_tokens` are kept, not dropped (see dataloader's
    # _token_filter), so this can never silently delete a source -- but note
    # that MLS non-English carries neither num_tokens nor pnc_text, so the
    # filter is blind on four of this mixture's sources.
    max_tokens: 400

    # Sampling
    shuffle: true
    drop_last: false
    # Stage 2 draws a different slice of each source than stage 1 did: both
    # stages stream the same ASR corpora, so reusing 42 would replay audio the
    # model has already seen. NOTE the launcher overrides shard_seed from
    # $MELT_SEED, so the submit command must pass MELT_SEED=1337 as well --
    # the value here is only what a bare `python train.py` would use.
    seed: 1337
    # A fixed scalar, not 'randomized': with indexed sources the partitioning
    # already separates the per-(rank, worker) streams, and the loader ignores
    # 'randomized' and falls back to `seed` with a warning anyway.
    shard_seed: 1337

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 2
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    # Generation-based evaluation costs ~N sequential decoder steps per sample
    # instead of a single forward, so the full validation set is not affordable.
    #
    # NOTE this cap is applied PER NAMED EVAL SET, not per config: here
    # 7 named eval sets x 200 = ~1400 utterances per eval.
    #
    # Measured on an H100 (artemis): ~2.2 s/utterance at
    # generation_max_length 64, and the cost is roughly linear in the token
    # budget because nothing in the training targets teaches the model to stop
    # (see docs/generation_eval.md) -- so every sample spends the whole budget.
    # Budget the eval against eval_steps before raising either number.
    #
    # materialize_cuts_for_eval applies the cap with a seeded shuffle, so every
    # run scores the same subset.
    max_samples: 200
    input_cfg:
      # ASR en validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.metadata.sentence
        # 27.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/dev
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 15.8 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR de validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.metadata.sentence
        # 2.5 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/dev
        tags:
          task: asr
          lang: de
