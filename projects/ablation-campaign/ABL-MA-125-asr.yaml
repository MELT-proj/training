# MELT Training Configuration
# Following NeMo SpeechLM2 configuration structure
#
# Usage:
#   python src/train.py --config config/train/asr.yaml
#   python src/train.py --config config/train/asr.yaml --trainer.max_steps=1000
#   python src/train.py --config config/train/asr.yaml --run.exp_name=my_experiment

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: SFT-v1.4.0
  dry_run: false

# =============================================================================
# Model Configuration
# =============================================================================
model:
  encoder:
    name: facebook/w2v-bert-2.0
    freeze: true
    max_audio_seq_len: 1500 # for frames of 20ms, this is 30s

  decoder:
    name: Qwen/Qwen3-1.7B
    attn_implementation: flash_attention_2
    freeze: true
    bos_token: <|startoftext|>
    eos_token: <|endoftext|>
    pad_token: <|text_pad|> # used if not specified in tokenizer
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>
  
  adapter:
    freeze: false
    _type: mlp
#   num_adapter_layers: 2
#   adapter_kernel_size: 3
#   adapter_stride: 2
  
  ckpt: null # IMPORTANT: this should be set from the CLI!

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000
  apply_chat_template: false
  strict_text_field: true

  train_ds:
    # Data sources - list of datasets to load
    # Generated by infra/compute_mix_weights.py — do not hand-edit.
    # Two-tier language/corpus balancing, Section 3.3.1 of arXiv:2509.14128,
    # with alpha=0.5 (corpus within language) and beta=0.5 (across languages).
    #
    # Group weight   = p_l, the language entry's share of the mix.
    # Child weight   = p_c, the corpus's share within its language entry.
    # The two levels are muxed separately, so the sampling probability of a
    # corpus is the product p_l * p_c. Do not pre-multiply them.
    #
    # Do NOT set `reweight_temperature` alongside this file (NeMo only).
    # alpha/beta are already baked into the weights below; NeMo would raise
    # them to a further power. Both levels already sum to 1, so the
    # normalisation itself is a no-op.
    #
    # 130 corpora, 65 language entries, 319,054.7 h total.
    input_cfg:
      # ASR en: 125.0 h, reference-matched mix
      - type: group
        weight: 0.20000000
        tags:
          task: asr
          lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/train
            weight: 0.36361689
            tags:
              task: asr
              lang: en
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/train
            weight: 0.35322971
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/English/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: en
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/train
            weight: 0.11146115
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR de: 125.0 h, reference-matched mix
      - type: group
        weight: 0.20000000
        tags:
          task: asr
          lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/train
            weight: 0.36361689
            tags:
              task: asr
              lang: de
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/train
            weight: 0.35322971
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: de
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/train
            weight: 0.11146115
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR fr: 125.0 h, reference-matched mix
      - type: group
        weight: 0.20000000
        tags:
          task: asr
          lang: fr
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/train
            weight: 0.36361689
            tags:
              task: asr
              lang: fr
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/train
            weight: 0.35322971
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: fr
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/train
            weight: 0.11146115
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR es: 125.0 h, reference-matched mix
      - type: group
        weight: 0.20000000
        tags:
          task: asr
          lang: es
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/train
            weight: 0.36361689
            tags:
              task: asr
              lang: es
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/train
            weight: 0.35322971
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: es
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/train
            weight: 0.11146115
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR it: 125.0 h, reference-matched mix
      - type: group
        weight: 0.20000000
        tags:
          task: asr
          lang: it
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/train
            weight: 0.36361689
            tags:
              task: asr
              lang: it
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/train
            weight: 0.35322971
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: it
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/train
            weight: 0.11146115
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
    # Stats
    # total_hours is overwritten by infra/compute_mix_weights.py from its own
    # measurement; total_cuts is not (see docs/mixture_weights.md), so it is
    # maintained here. Both count the 22 yodas-granary ast leaves twice, once
    # per task, because the mixture draws from each of those leaves twice.
    total_hours: 625.00
    total_cuts: 120949122
    force_estimate: false

    # Duration filtering
    min_duration: 0.5
    max_duration: 120.0
    
    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    batch_duration: 90  # seconds of audio per batch
    quadratic_duration: 30 # see https://lhotse.readthedocs.io/en/latest/datasets.html#lhotse.dataset.sampling.TimeConstraint

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    buffer_size: 10000
    bucket_duration_bins: [2.6, 4.0, 5.0, 6.0, 7.02, 8.18, 9.54, 10.56, 11.38, 12.16, 12.94, 13.68, 14.41, 15.14, 15.86, 16.59, 17.32, 18.05, 18.81, 19.58, 21.18, 23.78, 26.32, 28.9, 33.18, 35.62, 36.98, 38.08, 39.08]

    # Sampling
    shuffle: true
    drop_last: false
    seed: 42
    # A fixed scalar, not 'randomized': with indexed sources the partitioning
    # already separates the per-(rank, worker) streams, and the loader ignores
    # 'randomized' and falls back to `seed` with a warning anyway.
    shard_seed: 42

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    input_cfg:
      # ASR en validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.metadata.sentence
        # 27.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/dev
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 15.8 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR de validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.metadata.sentence
        # 2.5 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/dev
        tags:
          task: asr
          lang: de
          text_field: custom.pnc_text
        # 14.3 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR fr validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/validation
        tags:
          task: asr
          lang: fr
          text_field: custom.metadata.sentence
        # 24.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/dev
        tags:
          task: asr
          lang: fr
          text_field: custom.pnc_text
        # 10.1 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_fr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/validation
        tags:
          task: asr
          lang: fr
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR es validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.metadata.sentence
        # 26.8 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/dev
        tags:
          task: asr
          lang: es
          text_field: custom.pnc_text
        # 10.0 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.pnc_text
        # 5.1 h of voxpopuli (validation split)
      # ASR it validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.metadata.sentence
        # 25.4 h of cv22_sidon (validation split)
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/dev
        tags:
          task: asr
          lang: it
          text_field: custom.pnc_text
        # 5.2 h of mls_sidon (dev split)
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.pnc_text
        # 4.5 h of voxpopuli (validation split)
    # Statistics
    total_hours: 186.03
    total_cuts: 28815
    force_estimate: true

    # data.strict_text_field is not inherited by eval (resolve_eval_data_config
    # only carries apply_chat_template/prompt_template/*/chat_template_config,
    # dataloader.py:1226-1231), so it is set explicitly here to match training.
    strict_text_field: true

    # Batch composition
    batch_size: 16
    batch_duration: null

    buffer_size: 20000
    shuffle: false
    drop_last: true
    min_duration: 0.5
    max_duration: 120.0
    num_workers: 0
    pin_memory: true
    prefetch_factor: null
    sample_rate: 16000
    text_field: text
    lang_field: lang

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 42
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse, set to 1
  # Eval does NOT go through Lhotse — it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule
  lr_scheduler_type: cosine
  warmup_steps: 20

  # Duration
  num_train_epochs: 2
  max_steps: -1

  # Logging
  logging_strategy: steps
  logging_steps: 5
  report_to: wandb

  # Evaluation
  eval_strategy: steps # "no" # steps
  eval_steps: 100
  batch_eval_metrics: true

  # Checkpointing
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 5

  # Performance
  bf16: true
  group_by_length: false
  dataloader_num_workers: 4  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95
  encoder_lr: 6e-6
  decoder_lr: 2e-5
  adapter_lr: 2e-4
  min_lr_scale: 0.1
