# Fondue.yaml: generated by build_fondue_mix.py `render`. Do not hand-edit.
# Phase 1 of 2: warmup and constant LR, up to the annealing step.
# Weights on the hours surviving this phase's filters: ST 26.4% of them, then alpha 0.2 /
# beta 0.5 inside each task. total_hours (464,813) is the constant phase's surviving
# pool; max_steps 62133 draws it at 16 nodes x 4 GPUs and a fill of 0.877, and
# the last fifth, from step 49707, anneals.
#
# Fondue: one full fine-tune from the Hub components, no MA stage (PI, 2026-10-29).
# DRAFT, NOT FROZEN. The rows still open are marked "# OPEN"; plan/06-fondue.md §3
# holds the decision table and plan/timeline.md the dates.
#
# Rendered in two steps by build_fondue_mix.py (its docstring has the commands):
#   1. `sources` writes every training source, tagged, into Fondue-sources.yaml;
#   2. `render` weights them with the two-tier policy of infra/compute_mix_weights.py
#      on the hours that survive the quality filters, and writes one config per phase:
#      Fondue.yaml (warmup and constant LR, stops at the annealing step) and
#      Fondue-anneal.yaml (resumes there with the annealing filters and weights).
# Edit this template or the builder, never the rendered files.

# =============================================================================
# Run Configuration
# =============================================================================
run:
  exp_name: Fondue
  dry_run: false
  memory_preallocation: true
  stop_after_step: 49707 # the annealing phase resumes here with Fondue-anneal.yaml

# =============================================================================
# Model: Whisper-large-v3 + MoE (8 experts, top-2) at 10 Hz + EuroLLM-1.7B-Instruct,
# everything trainable (PI, 2026-10-29 and 10-30).
# =============================================================================
model:
  encoder:
    name: openai/whisper-large-v3
    freeze: false
    max_audio_seq_len: 3000 # Whisper takes exactly 30 s of 10 ms mel frames
    attn_implementation: flash_attention_2
    apply_spec_augment: false

  decoder:
    # PROVISIONAL: EuroLLM-1.7B-Instruct-2512 may replace it at the IFT freeze
    # (11-05); same tokens and chat template (plan_arm.py's decoder table).
    name: utter-project/EuroLLM-1.7B-Instruct
    attn_implementation: flash_attention_2
    freeze: false
    eos_token: <|im_end|>
    pad_token: </s>
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>

  adapter:
    _type: moe
    freeze: false
    stack_factor: 5 # 50 Hz Whisper frames -> 10 Hz into the decoder (PI, 2026-10-30)

  ckpt: null # from the Hub: no MA stage

  # Not optional: without it the Hub's bf16 decoder trains in pure bf16 under DDP.
  # The 10-24 scaling bench ran without it and went to loss 0 / grad_norm nan at step 2.
  master_dtype: float32

# =============================================================================
# Data
# =============================================================================
data:
  sample_rate: 16000

  apply_chat_template: true
  prompt_template_selection: random
  chat_template_config: chatml

  strict_text_field: true
  skip_text_field_mismatch: true

  train_ds:
    # Generated by infra/compute_mix_weights.py — do not hand-edit.
    # Two-tier language/corpus balancing, Section 3.3.1 of arXiv:2509.14128,
    # with alpha=0.2 (corpus within language) and beta=0.5 (across languages).
    #
    # Weights are CUT probabilities (--weights cuts). lhotse's mux draws one cut per
    # pick, so a corpus supplies weight x its mean cut length of audio. The policy's
    # p_l and p_c (shares of AUDIO hours) are turned into the cut probabilities that
    # deliver them: proportional to hours / mean cut length, renormalised.
    # Group weight   = the language entry's share of the cuts drawn.
    # Child weight   = the corpus's share of the cuts within its language entry.
    # The two levels are muxed separately, so the share of cuts a corpus gets is the
    # product of the two. Do not pre-multiply them.
    #
    # Do NOT set `reweight_temperature` alongside this file (NeMo only).
    # alpha/beta are already baked into the weights below; NeMo would raise
    # them to a further power. Both levels already sum to 1, so the
    # normalisation itself is a no-op.
