    # The hours Fondue draws over BOTH phases, set by the builder to the hours that
    # survive the constant phase's filters ("train on all the data", PI 11-01).
    total_hours: 516824.4
    force_estimate: false

    min_duration: 0.5
    max_duration: 60.0

    batch_size: null
    # 30 x grad_accum 16 (PI, 11-01): same audio per step as 15 x 20, 17-20% fewer
    # GPU-h (step profile, PR #166), 54.4 of 63 GB peak with checkpointing on. A
    # micro-batch carries ~26.3 s of audio (2.23 cuts), the fill the builder uses.
    batch_duration: 30
    quadratic_duration: null
    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    buffer_size: 10000
    # Measured 11-04 on MN5's sources by infra/check_training_config.py --only bins
    # --measure (per-source duration histograms x the constant phase's weights, before the
    # cut filter). The 30.0 repeats are Mosel's many 30 s cuts: lhotse needs the edges
    # sorted, not distinct, and the repeats only leave empty buckets.
    bucket_duration_bins: [2.52, 3.62, 4.6, 5.55, 6.55, 7.71, 9.14, 10.78, 12.42, 14.14, 15.34, 16.87, 18.46, 20.2, 22.98, 25.54, 27.47, 28.56, 29.44, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 32.84, 36.64, 38.54]
    max_tokens: 400

    shuffle: true
    drop_last: false
    seed: 1337
    shard_seed: 1337
    num_workers: 1
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

    # Per-cut quality bands (PR #157), one condition per rule: each phase has its own
    # config. Thresholds are the builder's policy (PI, 11-01).
    cut_filter:
      scores_root: ${oc.env:LOCAL_ASR_SCORES_DIR}
      rules:
        asr_wer_c15a05: # WER < 0.15
          match: {task: asr, scored: wer, wer_band: c15a05}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.1499
        asr_wer_c20a05: # WER < 0.20
          match: {task: asr, scored: wer, wer_band: c20a05}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.1999
        asr_wer_c30a10: # WER < 0.30
          match: {task: asr, scored: wer, wer_band: c30a10}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.2999
        asr_wer_c40a15: # WER < 0.40
          match: {task: asr, scored: wer, wer_band: c40a15}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.3999
        asr_wer_c50a20: # WER < 0.50
          match: {task: asr, scored: wer, wer_band: c50a20}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.4999
        st_align: # audio and English transcript aligned before xCOMET says anything
          match: {task: st, scored: spite}
          field: custom.spite.blaser2_src
          min: 4.5
        st_xcomet_de:
          match: {task: st, scored: spite, tgt_lang: de}
          field: custom.spite.scores.de.xcomet_xl
          min: 0.85
        st_xcomet_es:
          match: {task: st, scored: spite, tgt_lang: es}
          field: custom.spite.scores.es.xcomet_xl
          min: 0.85
        st_xcomet_fr:
          match: {task: st, scored: spite, tgt_lang: fr}
          field: custom.spite.scores.fr.xcomet_xl
          min: 0.85
        st_xcomet_it:
          match: {task: st, scored: spite, tgt_lang: it}
          field: custom.spite.scores.it.xcomet_xl
          min: 0.85
        st_xcomet_nl:
          match: {task: st, scored: spite, tgt_lang: nl}
          field: custom.spite.scores.nl.xcomet_xl
          min: 0.85
        st_xcomet_pt:
          match: {task: st, scored: spite, tgt_lang: pt}
