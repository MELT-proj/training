    # 213 corpora, 62 language entries, 464,813.1 h total.
    input_cfg:
      # en: 153,990.5 h across 11 corpora -- 13.1% of the cuts, 15.8% of the audio
      - type: group
        weight: 0.13148875
        tags:
          task: asr
          lang: en
