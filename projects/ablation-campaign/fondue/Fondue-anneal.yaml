    # 159 corpora, 33 language entries, 242,389.9 h total.
    input_cfg:
      # en: 119,419.9 h across 11 corpora -- 28.8% of the cuts, 34.4% of the audio
      - type: group
        weight: 0.28842837
        tags:
          task: asr
