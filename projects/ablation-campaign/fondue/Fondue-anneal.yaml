            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/fleurs/ga_ie/train
            weight: 0.28729614
            tags:
              task: asr
              lang: ga
              scored: wer
              wer_band: c50a20
              region_code: ga
            # 2.9 h, mean cut 15.3 s, 0.0% of the audio
