    shard_seed: 1337
    num_workers: 1
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

    # Per-cut quality bands (PR #157), one condition per rule: each phase has its own
    # config. Thresholds are the builder's policy (PI, 11-01).
    cut_filter:
      scores_root: ${oc.env:LOCAL_ASR_SCORES_DIR}
      rules:
        asr_wer_c15a05: # WER < 0.05
          match: {task: asr, scored: wer, wer_band: c15a05}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.0499
        asr_wer_c20a05: # WER < 0.05
          match: {task: asr, scored: wer, wer_band: c20a05}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.0499
        asr_wer_c30a10: # WER < 0.10
