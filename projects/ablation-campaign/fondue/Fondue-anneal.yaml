              lang: lv
              scored: wer
              wer_band: c50a20
              region_code: lv
            # 0.0 h, mean cut 7.4 s, 0.0% of the audio
      # ga: 3.2 h across 2 corpora -- 0.1% of the cuts, 0.1% of the audio
      - type: group
        weight: 0.0009756557
        tags:
          task: asr
          lang: ga
