            # 0.3 h, mean cut 4.0 s, 0.0% of the audio
    # The hours Fondue draws over BOTH phases, set by the builder to the hours that
    # survive the constant phase's filters ("train on all the data", PI 11-01).
    total_hours: 516824.4
    force_estimate: false

    min_duration: 0.5
    max_duration: 60.0

    batch_size: null
    # 30 x grad_accum 16 (PI, 11-01): same audio per step as 15 x 20, 17-20% fewer
    # GPU-h (step profile, PR #166), 54.4 of 63 GB peak with checkpointing on. A
    # micro-batch carries ~26.3 s of audio (2.23 cuts), the fill the builder uses.
    batch_duration: 30
    quadratic_duration: null
    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    buffer_size: 10000
    # Measured 11-04 on MN5's sources by infra/check_training_config.py --only bins
