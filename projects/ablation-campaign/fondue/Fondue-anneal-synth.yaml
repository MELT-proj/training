# Fondue-anneal-synth.yaml: generated by build_fondue_mix.py `synth` from Fondue-anneal.yaml. Do not hand-edit.
# Fondue-anneal.yaml plus SpeechBlocks-Synth-v1 (2026-11-18): 12.2% of the audio drawn (15.6% of the cuts)
# comes from its 879 ST leaves in 192 direction groups. The notes below describe the deployed mixture.
# Phase 2 of 2: resume from Fondue.yaml's checkpoint-55167 and anneal.
# The data stream restarts (the mixture changed; run.restart_data_stream), with a
# new data seed so it does not replay phase 1's draw order. Launch it with a
# MELT_SEED other than phase 1's: the launcher sets shard_seed from it.
# Weights on the hours surviving this phase's filters: ST 10.4% of them, then alpha 0.5 /
# beta 0.5 inside each task. total_hours (515,874) is the constant phase's surviving
# pool; max_steps 68958 draws it at 16 nodes x 4 GPUs and a fill of 0.877, and
# the last fifth, from step 55167, anneals.
#
# Fondue: one full fine-tune from the Hub components, no MA stage (PI, 2026-10-29).
# DRAFT, NOT FROZEN. The rows still open are marked "# OPEN"; plan/06-fondue.md §3
# holds the decision table and plan/timeline.md the dates.
#
# Rendered in two steps by build_fondue_mix.py (its docstring has the commands):
#   1. `sources` writes every training source, tagged, into Fondue-sources.yaml;
#   2. `render` weights them with the two-tier policy of infra/compute_mix_weights.py
#      on the hours that survive the quality filters, and writes one config per phase:
#      Fondue.yaml (warmup and constant LR, stops at the annealing step) and
#      Fondue-anneal.yaml (resumes there with the annealing filters and weights).
# Edit this template or the builder, never the rendered files.

# =============================================================================
# Run Configuration
# =============================================================================
run:
  exp_name: Fondue
  dry_run: false
  memory_preallocation: true
  stop_after_step: null
  restart_data_stream: true # a new mixture: keep the model, optimizer and LR, not the stream
  # Every Fondue job after the first is a resume, and the fit leaves no room for AdamW's
  # state before the first window (54 of 63 GB fresh): load it at the first step.
  defer_optimizer_load: true

# =============================================================================
# Model: Whisper-large-v3 + MoE (8 experts, top-2) at 10 Hz + EuroLLM-1.7B-Instruct-2512,
# everything trainable (PI, 2026-10-29, 10-30 and 11-04).
# =============================================================================
model:
  encoder:
    name: openai/whisper-large-v3
    freeze: false
    max_audio_seq_len: 3000 # Whisper takes exactly 30 s of 10 ms mel frames
    attn_implementation: flash_attention_2
    apply_spec_augment: false

  decoder:
    # PI, 11-04: Instruct-2512, queued while the base-2512 arm is scored. If base wins,
    # before the job starts: name: utter-project/EuroLLM-1.7B-2512, plus a line
    # chat_template_from: utter-project/EuroLLM-1.7B-Instruct-2512 (the base ships no
    # chat template; the base-2512 arm ran exactly so).
    name: utter-project/EuroLLM-1.7B-Instruct-2512
    attn_implementation: flash_attention_2
    freeze: false
    eos_token: <|im_end|>
    pad_token: </s>
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>

  adapter:
    _type: moe
    freeze: false
    stack_factor: 5 # 50 Hz Whisper frames -> 10 Hz into the decoder (PI, 2026-10-30)
    # PI, 11-08: the documented weight, which PR #171 makes the real one. Before it the
    # Trainer's rescaling made it coef x 64 GPUs x ga 16 = 10.24 for Fondue.
    router_aux_loss_coef: 0.01

  ckpt: null # from the Hub: no MA stage

  # Not optional: without it the Hub's bf16 decoder trains in pure bf16 under DDP.
  # The 10-24 scaling bench ran without it and went to loss 0 / grad_norm nan at step 2.
  master_dtype: float32

# =============================================================================
# Data
# =============================================================================
data:
  sample_rate: 16000

  apply_chat_template: true
  prompt_template_selection: random
  chat_template_config: chatml

  strict_text_field: true
  skip_text_field_mismatch: true

  train_ds:
    # Generated by infra/compute_mix_weights.py — do not hand-edit.
    # Two-tier language/corpus balancing, Section 3.3.1 of arXiv:2509.14128,
    # with alpha=0.5 (corpus within language) and beta=0.5 (across languages).
    #
    # Weights are CUT probabilities (--weights cuts). lhotse's mux draws one cut per
    # pick, so a corpus supplies weight x its mean cut length of audio. The policy's
    # p_l and p_c (shares of AUDIO hours) are turned into the cut probabilities that
    # deliver them: proportional to hours / mean cut length, renormalised.
    # Group weight   = the language entry's share of the cuts drawn.
    # Child weight   = the corpus's share of the cuts within its language entry.
    # The two levels are muxed separately, so the share of cuts a corpus gets is the
    # product of the two. Do not pre-multiply them.
    #
    # Do NOT set `reweight_temperature` alongside this file (NeMo only).
    # alpha/beta are already baked into the weights below; NeMo would raise
    # them to a further power. Both levels already sum to 1, so the
    # normalisation itself is a no-op.
    #
    # 160 corpora, 33 language entries, 256,213.6 h total.
    #
    # SpeechBlocks-Synth-v1 (build_fondue_mix.py synth, spec of 2026-11-18): 12.2% of the audio drawn
    # (15.6% of the cuts) comes from its 879 ST leaves in 192 direction groups, the last groups
    # below, weighted by the same alpha/beta over their own kept hours. The groups above are the deployed
    # mixture with every audio share scaled by 0.878215 (the weights, which count cuts, by 0.829922),
    # except that 26 noisy copies of the native tail sit inside the group of their language. That group
    # keeps its audio share, and since the copies' cuts are shorter its weight is raised, by 0.99 to 1.40x before the scaling.
    #
    # Streams (tag synth_stream):
    #   A: English speech into 18 languages (ST)
    #   B: FLEURS read speech of the 18 low-resource languages into en/de/fr/es/it (ST)
    #   C: native speech of the low-resource languages into other languages (ST)
    #   D: existing ST data (Granary X->en, CoVoST2 en->et/lv/sl/sv), now MetricX-scored (ST)
    #   E: synthetic (TTS) English speech into 18 languages (ST)
    #   F: noisy copies of A, C and E (ST, tagged with their source's letter) and of the native tail (ASR, tagged F)
    input_cfg:
      # en: 118,936.3 h across 10 corpora -- 15.5% of the cuts, 15.6% of the audio
      - type: group
        weight: 0.1551934241
        tags:
          task: asr
          lang: en
