            # 0.1 h, mean cut 4.3 s, 0.0% of the audio
    # The hours Fondue draws over BOTH phases, set by the builder to the hours that
    # survive the constant phase's filters ("train on all the data", PI 11-01).
    total_hours: 515873.9
    total_cuts: 177533199
    force_estimate: false

    min_duration: 0.5
    max_duration: 60.0

    batch_size: null
    # 30 x grad_accum 16 (PI, 11-01): same audio per step as 15 x 20, 17-20% fewer
    # GPU-h (step profile, PR #166), 54.4 of 63 GB peak with checkpointing on. A
    # micro-batch carries ~26.3 s of audio (2.23 cuts), the fill the builder uses.
    batch_duration: 30
    quadratic_duration: null
    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    buffer_size: 10000
    # Measured 11-04 on MN5's sources by infra/check_training_config.py --only bins
    # --measure (per-source duration histograms x the constant phase's weights, before the
    # cut filter). The 30.0 repeats are Mosel's many 30 s cuts: lhotse needs the edges
    # sorted, not distinct, and the repeats only leave empty buckets.
    bucket_duration_bins: [2.52, 3.62, 4.6, 5.55, 6.55, 7.71, 9.14, 10.78, 12.42, 14.14, 15.34, 16.87, 18.46, 20.2, 22.98, 25.54, 27.47, 28.56, 29.44, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 30.0, 32.84, 36.64, 38.54]
    max_tokens: 400

    shuffle: true
    drop_last: false
    seed: 1338
    shard_seed: 1338
    num_workers: 1
    # Each resume-position record re-checks the whole source graph per buffered cut: at 1,
    # 90% of a worker's CPU (30 s/step, 11-07/08). torchdata records any batch within
    # num_workers x prefetch_factor + num_workers + 1 = 34 of the interval's end, so 16
    # still recorded every batch (31 s/step, MoE smokes 11-08); 512 records ~7% (~5 s/step).
    # Resume stays exact: it replays up to 512 batches (~32 steps) since the last record.
    # SpeechBlocks-Synth-v1 adds 905 leaves to the 160 above, and a snapshot
    # walks the whole graph per buffered cut: measured on nyx (one worker, world size 64), 6.5 s a snapshotted batch
    # at 905 leaves against 1.0 s at 150, in the 34 batches of every window. Every 512 that stalls the GPUs ~4 min
    # in ~4.5; every 8192, ~6% of the run. A resume replays up to 8192 batches.
    snapshot_every_n_steps: 8192
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

    # Per-cut quality bands (PR #157), one condition per rule: each phase has its own
    # config. Thresholds are the builder's policy (PI, 11-01).
    cut_filter:
      scores_root: ${oc.env:LOCAL_ASR_SCORES_DIR}
      rules:
        asr_wer_c15a05: # WER < 0.05
          match: {task: asr, scored: wer, wer_band: c15a05}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.0499
        asr_wer_c20a05: # WER < 0.05
          match: {task: asr, scored: wer, wer_band: c20a05}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.0499
        asr_wer_c30a10: # WER < 0.10
          match: {task: asr, scored: wer, wer_band: c30a10}
          array: wer
          missing: keep # languages neither recognizer covers
          max: 0.0999
        asr_wer_c40a15: # WER < 0.15
