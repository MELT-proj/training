    prompt_template:
      asr: "Transcribe the following {lang} audio: {audio_token}"
      st: "Translate the following audio into {lang}: {audio_token}"
    batch_size: 16
    batch_duration: null
    buffer_size: 20000
    shuffle: false
    drop_last: true
    min_duration: 0.5
