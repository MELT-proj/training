# MELT Training Configuration
# Following NeMo SpeechLM2 configuration structure
#
# Usage:
#   python src/train.py --config config/train/asr.yaml
#   python src/train.py --config config/train/asr.yaml --trainer.max_steps=1000
#   python src/train.py --config config/train/asr.yaml --run.exp_name=my_experiment

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: mn5-iwslt26
  dry_run: false

# =============================================================================
# Model Configuration
# =============================================================================
model:
  encoder:
    name: facebook/w2v-bert-2.0
    freeze: true
    max_audio_seq_len: 1500 # for frames of 20ms, this is 30s

  decoder:
    name: Qwen/Qwen2.5-0.5B
    attn_implementation: flash_attention_2
    bos_token: <|startoftext|>
    eos_token: <|endoftext|>
    pad_token: <|text_pad|> # used if not specified in tokenizer
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>
    freeze: true
  
  adapter:
    _type: conformer
    num_adapter_layers: 2
    adapter_kernel_size: 3
    adapter_stride: 2

  ckpt: null  # Path to checkpoint to resume from

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000
  apply_chat_template: false
  strict_text_field: true

  train_ds:
    total_hours: 1250.00
    total_cuts: 2143430 #11588853  # Optional: total number of cuts for estimation
    force_estimate: false  # Force estimation of total_hours at start

    # Data sources - list of datasets to load
    input_cfg:
      # ASR en: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/train
            weight: 0.36361689
            tags:
              task: asr
              lang: en
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/train
            weight: 0.35322971
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/English/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: en
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/train
            weight: 0.11146115
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR de: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/train
            weight: 0.36361689
            tags:
              task: asr
              lang: de
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/train
            weight: 0.35322971
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: de
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/train
            weight: 0.11146115
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR fr: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: fr
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/train
            weight: 0.36361689
            tags:
              task: asr
              lang: fr
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/train
            weight: 0.35322971
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: fr
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/train
            weight: 0.11146115
            tags:
              task: asr
              lang: fr
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR es: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: es
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/train
            weight: 0.36361689
            tags:
              task: asr
              lang: es
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/train
            weight: 0.35322971
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: es
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/train
            weight: 0.11146115
            tags:
              task: asr
              lang: es
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ASR it: 125.0 h, reference-matched mix
      - type: group
        weight: 0.10000000
        tags:
          task: asr
          lang: it
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/train
            weight: 0.36361689
            tags:
              task: asr
              lang: it
              text_field: custom.metadata.sentence
            # 45.5 h of cv22_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/train
            weight: 0.35322971
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 44.2 h of mls_sidon
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/asr_only
            weight: 0.17169225
            tags:
              task: asr
              lang: it
            # 21.5 h of yodas-granary
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/train
            weight: 0.11146115
            tags:
              task: asr
              lang: it
              text_field: custom.pnc_text
            # 13.9 h of voxpopuli
      # ST de->en: 125.0 h (7,429.1 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: de
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: de
              tgt_lang: en
              text_field: custom.translation_en
      # ST fr->en: 125.0 h (11,511.7 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: fr
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/French/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: fr
              tgt_lang: en
              text_field: custom.translation_en
      # ST es->en: 125.0 h (25,833.3 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: es
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Spanish/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: es
              tgt_lang: en
              text_field: custom.translation_en
      # ST it->en: 125.0 h (6,024.7 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: it
          tgt_lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/Italian/ast
            weight: 1.00000000
            tags:
              task: st
              src_lang: it
              tgt_lang: en
              text_field: custom.translation_en
      # ST en->de: 125.0 h (429.9 h available)
      - type: group
        weight: 0.10000000
        tags:
          task: st
          src_lang: en
          tgt_lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/en_de/train
            weight: 1.00000000
            tags:
              task: st
              src_lang: en
              tgt_lang: de
    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    batch_duration: 480  # seconds of audio per batch
    quadratic_duration: 20 # see https://lhotse.readthedocs.io/en/latest/datasets.html#lhotse.dataset.sampling.TimeConstraint

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    buffer_size: 10000
    bucket_duration_bins: [3.42, 3.88, 4.18, 4.44, 4.68, 4.87, 5.06, 5.23, 5.4, 5.58, 5.76, 5.9, 6.08, 6.24, 6.41, 6.6, 6.8, 7.01, 7.22, 7.46, 7.75, 8.09, 8.5, 9.1, 10.1, 12.67, 14.12, 15.06, 15.9]

    # Sampling
    shuffle: true
    drop_last: false
    seed: 42
    shard_seed: 42

    # Duration filtering
    min_duration: 0.5
    max_duration: 30.0

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 2
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    # Generation-based evaluation costs ~N sequential decoder steps per sample
    # instead of a single forward, so the full validation set is not affordable
    # at this eval cadence. materialize_cuts_for_eval applies the cap with a
    # seeded shuffle, so every run scores the same subset.
    max_samples: 1000
    total_hours: 212.08
    total_cuts: 58238  # Optional: total number of cuts for estimation
    force_estimate: false

    input_cfg:
      # ASR en validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.metadata.sentence
        # 27.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/dev
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 15.8 h of mls_sidon (dev split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR de validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.metadata.sentence
        # 2.5 h of cv22_sidon (validation split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/dev
        tags:
          task: asr
          lang: de
          text_field: custom.pnc_text
        # 14.3 h of mls_sidon (dev split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR fr validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fr/validation
        tags:
          task: asr
          lang: fr
          text_field: custom.metadata.sentence
        # 24.3 h of cv22_sidon (validation split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/french/dev
        tags:
          task: asr
          lang: fr
          text_field: custom.pnc_text
        # 10.1 h of mls_sidon (dev split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/validation
        tags:
          task: asr
          lang: fr
          text_field: custom.pnc_text
        # 5.0 h of voxpopuli (validation split)
      # ASR es validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.metadata.sentence
        # 26.8 h of cv22_sidon (validation split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/spanish/dev
        tags:
          task: asr
          lang: es
          text_field: custom.pnc_text
        # 10.0 h of mls_sidon (dev split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.pnc_text
        # 5.1 h of voxpopuli (validation split)
      # ASR it validation: full cv22_sidon/mls_sidon/voxpopuli sets
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.metadata.sentence
        # 25.4 h of cv22_sidon (validation split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/italian/dev
        tags:
          task: asr
          lang: it
          text_field: custom.pnc_text
        # 5.2 h of mls_sidon (dev split)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.pnc_text
        # 4.5 h of voxpopuli (validation split)
      # ST en->de validation (dev split): 26.0 h. No X->en probe: yodas-granary's `ast` sets have no held-out split.
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/en_de/dev
        tags:
          task: st
          src_lang: en
          tgt_lang: de
    batch_size: null
    batch_duration: 300.0
    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    bucket_duration_bins: [2.86, 3.28, 3.64, 3.94, 4.22, 4.46, 4.7, 4.92, 5.14, 5.33, 5.52, 5.71, 5.9, 6.08, 6.26, 6.43, 6.62, 6.82, 7.01, 7.22, 7.42, 7.67, 7.94, 8.21, 8.57, 8.93, 9.4, 10.04, 13.2]
    shuffle: false
    drop_last: false
    min_duration: 0.5
    max_duration: 30.0
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    sample_rate: 16000
    text_field: text
    lang_field: lang

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}/iwslt_replica_v1
  overwrite_output_dir: true
  seed: 42
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse
  # Eval does NOT go through Lhotse — it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule
  lr_scheduler_type: cosine
  warmup_steps: 20

  # Duration
  num_train_epochs: 2
  max_steps: -1

  # Logging
  logging_strategy: steps
  logging_steps: 2
  report_to: wandb

  # Evaluation
  eval_strategy: steps # "no" # steps
  eval_steps: 100
  batch_eval_metrics: true

  # Evaluation decodes with generate() -- greedy, at most this many *new*
  # tokens (MELT's prompt is audio, so generation_max_length is read as a
  # new-token budget; see MELTTrainer._generation_kwargs).
  predict_with_generate: true
  generation_max_length: 256
  generation_num_beams: 1

  # Checkpointing
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 5

  # Performance
  bf16: true
  group_by_length: false  # Handled by Lhotse bucketing
  dataloader_num_workers: 4  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true
  # Reference/hypothesis pairs printed to stdout and logged to W&B each eval.
  # 0 disables.
  log_num_samples: 10

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95

  # encoder_lr: 6e-6 # Not used since it's frozen
  # decoder_lr: 2e-5 # Not used since it's frozen
  adapter_lr: 2e-5
  min_lr_scale: 0.1
