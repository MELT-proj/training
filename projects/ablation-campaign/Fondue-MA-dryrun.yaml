    # Rewritten by compute_mix_weights.py from what it measures on disk. It
    # MUST sit after input_cfg: the tool only looks for this key below the
    # block it replaces, so the draft's placement (above it) would have left
    # 240355.0 untouched.
    total_hours: 242077.6
    force_estimate: false

    # Batch settings ---------------------------------------------------------
    batch_size: null
    # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: effective batch and LR).
    # batch_duration x grad_accum x world_size = 30 x 4 x 32 = 3,840 audio-s = 1.07
    # audio-h per optimizer step (quadratic_duration unset, so a batch is real
    # seconds). batch_duration 30 is what a frozen Qwen3.5-2B decoder under DDP
    # needed in every earlier arm (campaign.yaml MA-700-qwen35-2b-ins); the
    # accumulation of 4 brings the step to about an audio hour, and 3,840 s is
    # also the Llama IFT arms' effective batch.
    batch_duration: 30
    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    # Re-measured 2026-09-25 on the full pool at max_duration 60 (90,052,889 cuts,
    # 241,995 h; infra/estimate_bucket_bins.py pooled these at
    # [2.44, 3.66, ..., 39.22]). These are the same 30 equal-duration buckets but
    # weighted by the mixture's sampling weights (p_cl per cut), because batches
    # are drawn from the mixture, not from the natural pool; the two agree
    # everywhere within about 1 s below 20 s and differ up to 3 s above it. Bins
    # are a property of max_duration and of the mixture: re-measure if either moves.
    bucket_duration_bins: [2.86, 4.0, 5.0, 5.88, 6.78, 7.82, 9.0, 10.2, 11.06, 11.9, 12.69, 13.44, 14.12, 14.59, 14.84, 15.04, 15.74, 16.48, 17.3, 18.14, 19.01, 19.92, 22.14, 25.12, 28.26, 33.16, 36.14, 37.78, 38.96]
    shuffle: false
    drop_last: false
    min_duration: 0.5
    max_duration: 60.0                   # settled (06 §3 filters)
    max_tokens: 400                      # settled (06 §3 filters)
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    sample_rate: 16000
    lang_field: lang

  validation_ds:
    strict_text_field: true
    # 200 per named set, as every ABL config. In-domain dev only; FLEURS
    # test/dev stays out of the trainer's loop (06 §3 FLEURS row is open).
    max_samples: 200
    force_estimate: false
