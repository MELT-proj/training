    # Rewritten by compute_mix_weights.py from what it measures on disk. It
    # MUST sit after input_cfg: the tool only looks for this key below the
    # block it replaces, so the draft's placement (above it) would have left
    # 240355.0 untouched.
    total_hours: 242102.5
    force_estimate: false

    # Batch settings ---------------------------------------------------------
    batch_size: null
    # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: effective batch and LR).
    # batch_duration x grad_accum x world_size = 112.5 x 1 x 32 = 3,600 audio-s
    # = one audio hour per optimizer step (quadratic_duration unset, so a
    # batch is real seconds and steps-per-epoch = total_hours). Whisper
    # padded every cut to 30 s and still peaked at 11.5 GB of 64 at bd 75 x 2
    # (campaign.yaml), so 112.5 fits the 64 GB H100 with the screen's 150 x 1.
    batch_duration: 112.5
    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    # STALE for this mix: copied from ABL-MA-700-asr.yaml (measured on the 700 h
    # five-language mix). Re-measured on the full distribution in the dry-run's
    # second phase (infra/estimate_bucket_bins.py at max_duration 60).
    bucket_duration_bins: [3.74, 4.32, 4.7, 5.04, 5.33, 5.59, 5.86, 6.1, 6.34, 6.58, 6.84, 7.1, 7.39, 7.72, 8.1, 8.54, 9.14, 10.0, 10.85, 11.87, 12.88, 13.84, 14.76, 15.62, 16.52, 17.37, 18.23, 19.1, 19.97]
    shuffle: false
    drop_last: false
    min_duration: 0.5
    max_duration: 60.0                   # settled (06 §3 filters)
    max_tokens: 400                      # settled (06 §3 filters)
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    sample_rate: 16000
