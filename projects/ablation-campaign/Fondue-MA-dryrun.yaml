# Fondue -- stage 1 (modality alignment), FULL-SCALE DRY-RUN config, 2026-09-25.
#
# THIS IS NOT THE FONDUE CONFIG AND NOTHING IN IT IS FROZEN. It exists to
# measure startup, dataloader build, throughput and host RAM at the real
# pool size and topology (timeline.md week 3, Track B). Every field that
# 06-fondue.md §3 still lists as open carries an inline
#   # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: ...)
# tag. Do not copy a provisional value into a campaign row.
#
# How it was made:
#   projects/ablation-campaign/fondue-ma-dryrun-template.yaml is the flat
#   template (one `type: lhotse_shar` per source; compute_mix_weights.py's
#   loader does NOT read `type: group`, so fondue-ma-draft.yaml cannot be its
#   input as drafted). This file is the render:
#
#     python3 infra/compute_mix_weights.py \
#         --config       projects/ablation-campaign/fondue-ma-dryrun-template.yaml \
#         --datasets-root /mnt/scratch-nyx/giuseppe/melt/melt-data/shar \
#         --alpha 0.5 --beta 0.5 \
#         --cache        infra/.mix_weights_hours.json \
#         --emit-config  projects/ablation-campaign/Fondue-MA-dryrun.yaml \
#         --exp-name     Fondue-MA-dryrun
#
#   Hours were measured on nyx. The run reads ${LOCAL_DATASETS_DIR} on MN5
#   (/gpfs/projects/epor48/melt-data/shar-indexed); all sources below exist
#   on both trees with identical cut-manifest shard counts. Edit the
#   template, not this file: hand edits inside train_ds.input_cfg are lost on
#   the next render.
#
# alpha=0.5, beta=0.5 as drafted (fondue-ma-draft.yaml header; arXiv:2509.14128
# 3.3.1). Language set is EU-24 + ru + uk + ca (PI, 2026-09-25: ca in). FLEURS train is IN
# (PI, 2026-09-25) so the tail keeps its data; FLEURS test + validation stay
# the benchmark and are not in validation_ds. Granary `ast` stays in MA as ASR
# (PI, 2026-09-25), though how much MA vs IFT each language needs is still open.
#
# Sources beyond the draft's stanzas: the draft listed only the Granary
# `asr_only` leaves, but data/hours_by_language.csv's asr_train_hours (which
# the draft's total_hours and 06 §1 quote) also counts the Granary `ast`
# leaves as ASR (es 25.8K of its 28.2K h, ru 18.4K of 20.2K h). They are
# included here as `task: asr` sources (PI, 2026-09-25: keep).

# =============================================================================
# Run Configuration
# =============================================================================
run:
  exp_name: Fondue-MA-dryrun
  dry_run: false
  memory_preallocation: true    # campaign convention: on whenever what is trainable changes

# =============================================================================
# Model Configuration
# =============================================================================
model:
  encoder:
    name: openai/whisper-large-v3        # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: audio stack, frame rate)
    freeze: true
    max_audio_seq_len: 3000              # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: audio stack, frame rate); derived as plan_arm.py does, ENCODER_WINDOW_FRAMES["openai/whisper-large-v3"]

  decoder:
    name: meta-llama/Llama-3.2-1B-Instruct   # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: backbone)
    attn_implementation: flash_attention_2
    eos_token: <|eot_id|>                # Llama-3 profile, as ABL-MA-700-asr.yaml / plan_arm.py DECODER_PROFILES
    pad_token: <|finetune_right_pad_id|>
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>
    freeze: true                         # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: regime); the MA convention

  adapter:
    freeze: false
    _type: mlp                           # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: audio stack, frame rate)
    stack_factor: 5                      # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: audio stack, frame rate); whisper 50 Hz -> 10 Hz

  ckpt: null

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000
  # The draft pinned this to false ("every arm"). ABL-MA-700-asr.yaml, the
  # base every screen arm ran, has it true for an instruct decoder, with the
  # llama3 template and an audio-only user turn; that is what is used here so
  # the dry run exercises the same input path as the screen.
  apply_chat_template: true            # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: backbone); follows the decoder, not the draft
  chat_template_config: llama3         # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: backbone)
  prompt_template_selection: custom
  prompt_template: "{audio_token}"
  strict_text_field: true              # settled campaign-wide (silent-text-field-fallback)

  train_ds:
    # One `type: lhotse_shar` per source, flat, so compute_mix_weights.py can
    # read it; the render nests them into type: group per language.
    # Generated by infra/compute_mix_weights.py — do not hand-edit.
    # Two-tier language/corpus balancing, Section 3.3.1 of arXiv:2509.14128,
    # with alpha=0.5 (corpus within language) and beta=0.5 (across languages).
    #
    # Group weight   = p_l, the language entry's share of the mix.
    # Child weight   = p_c, the corpus's share within its language entry.
    # The two levels are muxed separately, so the sampling probability of a
    # corpus is the product p_l * p_c. Do not pre-multiply them.
    #
    # Do NOT set `reweight_temperature` alongside this file (NeMo only).
    # alpha/beta are already baked into the weights below; NeMo would raise
    # them to a further power. Both levels already sum to 1, so the
    # normalisation itself is a no-op.
    #
    # 127 corpora, 27 language entries, 242,102.5 h total.
    input_cfg:
      # en: 151,848.7 h across 10 corpora
      - type: group
        weight: 0.29324114
        tags:
          task: asr
          lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/English/asr_only
            weight: 0.42919993
            tags:
              task: asr
              lang: en
              region_code: en
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/train
            weight: 0.26553357
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
              region_code: en
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/peoples_speech/clean/train
            weight: 0.10294884
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
              region_code: en
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/train
