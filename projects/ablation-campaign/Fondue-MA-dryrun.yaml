    # 99 corpora, 26 language entries, 240,123.4 h total.
    input_cfg:
      # en: 151,841.2 h across 9 corpora
      - type: group
        weight: 0.30628177
        tags:
          task: asr
          lang: en
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/English/asr_only
            weight: 0.43078085
            tags:
              task: asr
              lang: en
              region_code: en
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/english/train
            weight: 0.26651164
            tags:
              task: asr
              lang: en
              text_field: custom.pnc_text
              region_code: en
          - type: lhotse_shar
