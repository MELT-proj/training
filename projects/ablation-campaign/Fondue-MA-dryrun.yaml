# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}/iwslt_replica_v1
  overwrite_output_dir: true
  seed: 42
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  per_device_train_batch_size: -1      # handled by Lhotse
  per_device_eval_batch_size: 4
  # Topology: 8 nodes x 4 GPUs = world_size 32 (MELT_GPUS_PER_NODE=4).
  # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: topology; effective batch and LR)
  gradient_accumulation_steps: 1

  # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: effective batch and LR).
  # warmup-stable-decay as plan_arm.py composes it: last 20% of steps decay to
  # 0.1x peak (cosine), warmup 3% of steps. transformers 5.16.1 has NO
  # `warmup_ratio` argument (trainer_args_dict logs "dropping ... warmup_ratio"
  # and trains with no warmup, which is what `plan_arm.py --warmup-ratio`
  # produces today); a float below 1 in `warmup_steps` is the tf5 spelling of
  # the ratio (checked in melt_cuda126.sif: get_warmup_steps(1000) == 30).
  # num_decay_steps = round(0.2 x 240,124 steps) = 48025.
  lr_scheduler_type: warmup_stable_decay
  lr_scheduler_kwargs: {"num_decay_steps": 48025, "min_lr_ratio": 0.1, "decay_type": "cosine"}
  warmup_steps: 0.03

  num_train_epochs: 1                  # campaign convention; steps are derived, never pinned
  max_steps: -1

  logging_strategy: steps
  logging_steps: 2
  report_to: wandb

  eval_strategy: steps
  # DRY-RUN PROVISIONAL -- not a decision (06 §3 row: checkpoint and eval cadence).
  # ~6 h of wall clock at the extrapolated ~1.0 s/step is ~20,000 steps. The
  # dry-run job pushes both past max_steps from the command line.
  eval_steps: 20000
  batch_eval_metrics: true

  predict_with_generate: true
  generation_max_length: 256
  generation_num_beams: 1

  save_strategy: steps
  save_steps: 20000                    # DRY-RUN PROVISIONAL -- see eval_steps
  save_total_limit: 2                  # 06 §2: keep two checkpoints

  bf16: true
  group_by_length: false
  dataloader_num_workers: 4
  remove_unused_columns: false
  ddp_find_unused_parameters: false

