# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  # Stage 2, so 1337 rather than stage 1's 42. See data.train_ds.seed.
  seed: 1337
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse, set to 1
  # Eval does NOT go through Lhotse -- it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s. Do not
  # raise it in this stage: eval runs while the optimizer state is resident.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule
  lr_scheduler_type: cosine
  # 20 steps of a ~6300-step run. Inherited from the campaign recipe rather
  # than tuned for this stage; it is short for a run that unfreezes 1.24 B
  # parameters, so watch the first ~50 logged losses for a spike.
  warmup_steps: 20

  # Duration
  # One epoch, steps DERIVED rather than pinned, per the campaign convention:
  # pinning max_steps per arm is how two arms end up trained for different
  # amounts. quadratic_duration is null, so the derivation is exact:
  #
  #   steps = total_hours * 3600 / (batch_duration * world_size * grad_accum)
  #         = 6729.85 * 3600 / (120 * 8 * 4) = 6310
  #
  # each step carrying 120 * 8 * 4 = 3840 audio-seconds.
  num_train_epochs: 1
  max_steps: -1

  # Logging
  logging_strategy: steps
  logging_steps: 5
  report_to: wandb

  # Evaluation
  eval_strategy: steps # "no" # steps
  # ~12 rounds over 6310 steps, plus eval_on_start. Each round decodes
  # max_samples per named eval set -- 6 sets x 200 = 1200 utterances -- so it
  # is not free; stage 1 measured a round at roughly 3 min on 8 GPUs.
  eval_steps: 500
  batch_eval_metrics: true

  # Evaluation decodes with generate() -- greedy, at most this many *new*
  # tokens (MELT's prompt is audio, so generation_max_length is read as a
  # new-token budget; see MELTTrainer._generation_kwargs).
  predict_with_generate: true
  # 256, matching stage 1, so stage-2 WER is comparable with the 1.10-1.16 the
  # MA run ended at. ABL-IFT-125 used 64 for cost reasons; that number is not
  # comparable with either. Cost is bounded well below the budget here because
  # <|eot_id|> is in the loss, so the model does stop on its own.
  generation_max_length: 256
  generation_num_beams: 1

  # Checkpointing
  save_strategy: steps
  # NOTE these checkpoints are far larger than stage 1's. A trainable decoder
  # means the optimizer state is saved too: ~7.3 GB of weights plus ~14.8 GB of
  # AdamW moments, so budget ~22 GB per checkpoint and ~45 GB for the two kept.
  # 150, not 500, because of the MN5 host-RAM wall: a 2-node run saturates the
  # 500 GB/node cgroup and dies somewhere around step 340-360 (see
  # bash/memtrace.sh and issue #76). At 500 the first checkpoint sat *past* the
  # wall, so every one of these runs restarted from zero. 150 banks two
  # checkpoints before the wall and caps the work lost per crash at ~60 steps.
  # Resuming also respawns the DataLoader workers, which resets the growth --
  # the run makes forward progress even while the leak is unfixed. Revert to
  # 500 once the leak is closed; save_total_limit keeps the disk cost flat
  # either way.
  save_steps: 150
  save_total_limit: 2

  # Performance
  bf16: true
  group_by_length: false
  dataloader_num_workers: 4  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  # False is correct here even though the decoder is now trainable: every
  # decoder parameter participates in every forward. Setting it true would add
  # an unused-parameter scan to each step for nothing.
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true
  # Reference/hypothesis pairs printed to stdout and logged to W&B each eval.
  # 0 disables.
  log_num_samples: 10

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95
  # encoder_lr: 6e-6 # Not used since it's frozen
  # adapter_lr: 2e-4 # Not used since it's frozen
  # The only learning rate that does anything in this stage.
  decoder_lr: 2e-5
  min_lr_scale: 0.1
