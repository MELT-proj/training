# melt-eval prompt format: the SD24 training instruction's wording, but placed AFTER the audio.
# Separates the effect of position from the effect of wording. The asr entry is unused by the ST sets.
data:
  apply_chat_template: true
  prompt_template_selection: custom
  chat_template_config: chatml
  prompt_template:
    asr: "Repeat the following content exactly, word for word, and write nothing else.\n\n{audio_token}"
    st: "{audio_token}\n\nTranslate the content above into {tgt_lang}, and write nothing else."
model:
  decoder:
    audio_token: "<|audio|>"
