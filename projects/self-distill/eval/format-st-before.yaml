# melt-eval prompt format: ST instruction placed BEFORE the audio, different wording from the SD24 training instruction
# (one of the 6 random SFT templates). The asr entry is unused by the ST sets.
data:
  apply_chat_template: true
  prompt_template_selection: custom
  chat_template_config: chatml
  prompt_template:
    asr: "Repeat the following content exactly, word for word, and write nothing else.\n\n{audio_token}"
    st: "Translate the following audio into {tgt_lang}: {audio_token}"
model:
  decoder:
    audio_token: "<|audio|>"
