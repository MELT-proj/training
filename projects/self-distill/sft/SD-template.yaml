# @@HEADER@@

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: SD
  dry_run: false
  # Must stay false: the self-distillation trainer refuses the preallocation pass, which
  # would measure the gold-transcript forward and not the distillation step (rollout plus
  # two forwards). The smoke test is what turns "does batch_duration fit" into a number.
  memory_preallocation: false

# =============================================================================
# Model Configuration
# =============================================================================
# The launcher sets model.ckpt (the warm start) and the stack from the checkpoint
# and plan_arm's tables; the values below describe the same stack so the file
# also reads right on its own. While model.ckpt is set the architecture comes
# from the checkpoint, but attn_implementation is still read from here.
# Self-distillation trains the adapter ALONE: the decoder is the teacher, so training
# it would move the target, and the trainer refuses any other trainable parameter.
model:
  encoder:
    name: openai/whisper-large-v3
    freeze: true
    max_audio_seq_len: 3000 # Whisper takes exactly 30 s of 10 ms mel frames
    attn_implementation: flash_attention_2
    apply_spec_augment: false

  decoder:
    name: Qwen/Qwen3.5-2B
    attn_implementation: flash_attention_2
    freeze: true
    eos_token: <|endoftext|>
    pad_token: <|text_pad|>
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>

  adapter:
    _type: mlp
    freeze: false
    stack_factor: 5

  ckpt: null # IMPORTANT: set by the launcher (the warm-start checkpoint)

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000

  # Instruction formatting: the self-distillation trainer needs one FIXED template per task
  # (a randomly drawn instruction is what AZeroS shows hurts generalisation). The launcher
  # passes data.prompt_template.{asr,st} (repeat / translate-into-{tgt_lang}) and the
  # validation prompt, so the values here only keep the file honest.
  apply_chat_template: true
  prompt_template_selection: custom
  # Qwen 3 / 3.5 boundary markers; checked against the tokenizer at startup.
  chat_template_config: chatml

  # A configured text_field that resolves to nothing raises instead of silently
  # falling back to the supervision text (which holds different content for
  # every ST source and for cv22_sidon, whose supervision is empty).
  strict_text_field: true
  # Turns the one case strict mode would raise on -- a field empty on a cut that
  # has other text -- into a logged warning and a skipped cut. Needed because one
  # such cut (yodas-granary French ast, 1 in 4,000 of its shard) once took down
  # a whole distributed run, and a resume reaches the same cut again. The build
  # script audits every source and refuses to render one where this happens on
  # more than 0.1% of the sampled cuts, so it can only ever absorb stray cuts.
  skip_text_field_mismatch: true

  train_ds:
    input_cfg:
    # Stats. total_hours is the HOURS THE MIX DRAWS (not the size of the pools it
    # draws from), and total_cuts the matching number of cuts; the trainer turns
    # total_hours into steps per epoch:
    #
    #   steps = total_hours * 3600 / (batch_duration * world_size * grad_accum)
    #
    # The launcher pins max_steps from that and sets num_decay_steps = max_steps / 5.
    # Batches fill to less than batch_duration, so the audio a run really sees is
    # the train_hours counter in its log, not steps x batch_duration x world_size.
    total_hours: 0.0
    total_cuts: 0
    force_estimate: false

    # Duration filtering
    min_duration: 0.5
    max_duration: 60.0

    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    # Placeholder. Seconds of audio per rank per micro-batch; the smoke test
    # fixes the value that fits (encoder, adapter and decoder all train here).
    batch_duration: 60
    # Deliberately unset: lhotse would charge each cut d + d^2/q, so batch_duration
    # would budget effective seconds and the derived step count would no longer be
    # the true number of batches (#96). Unset, the charge is exactly d.
    quadratic_duration: null

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    buffer_size: 10000
    # Measured on THIS draw (per-source duration histograms x the weights below,
    # cuts outside [min_duration, max_duration] removed), by build_sft_mix.py.
    # A stale set is an OOM, not a throughput nuisance: RE-MEASURE THEM WHENEVER
    # the mix or max_duration changes (build_sft_mix.py does it on every render).
    bucket_duration_bins: []

    # Drop cuts whose transcript is pathologically long for their audio: batches
    # are budgeted by audio seconds, so a short cut with a runaway transcript still
    # sets the padded width of the whole batch (that is what ended an earlier run
    # at 77 GB on an 80 GB card). Cuts without custom.num_tokens are kept, not
    # dropped, so this can never remove a source; it is blind on the ones that
    # lack the field.
    max_tokens: 400

    # Sampling
    shuffle: true
    drop_last: false
    seed: 1337
    # A fixed scalar, not 'randomized': with indexed sources the partitioning
    # already separates the per-(rank, worker) streams, and the loader ignores
    # 'randomized' and falls back to `seed` with a warning anyway.
    shard_seed: 1337

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    # Generation-based evaluation costs ~N sequential decoder steps per sample
    # instead of a single forward, so the full validation set is not affordable.
    #
    # NOTE this cap is applied PER NAMED EVAL SET, not per config: every set below
    # is named, so a run reports eval_<name>_loss (plus WER/CER) per set, and each
    # set scores 20 clips. materialize_cuts_for_eval applies the cap with a seeded
    # shuffle, so every run, and both data conditions, score the same clips.
    max_samples: 20
    input_cfg:
    # Statistics: the full held-out sets, before max_samples. Both data conditions
    # render this block identically.
    total_hours: 0.0
    total_cuts: 0
    force_estimate: true

    # data.strict_text_field is not inherited by eval (resolve_eval_data_config
    # only carries apply_chat_template/prompt_template/*/chat_template_config),
    # so it is set explicitly here to match training. skip_text_field_mismatch
    # travels the same path.
    strict_text_field: true
    skip_text_field_mismatch: true

    # Eval prompt: PINNED, one instruction for every clip, eval step and run, so eval_<name>_loss
    # and the WER/CER only move when the model does. It is the instruction the student is distilled
    # under (the repeat one), so the in-training WER measures what the training objective teaches;
    # the launcher passes the same string. The scored comparison against the SFT runs is made
    # afterwards, by melt-eval, under each model's own and under a shared prompt.
    prompt_template_selection: custom
    # One string, not the per-task mapping of the SFT template: the launcher overrides it, and a
    # string over a mapping would not merge.
    prompt_template: "Repeat the following content exactly, word for word, and write nothing else.\n\n{audio_token}"

    # Batch composition
    batch_size: 16
    batch_duration: null

    buffer_size: 20000
    shuffle: false
    drop_last: true
    min_duration: 0.5
    # Matches train.
    max_duration: 60.0
    num_workers: 0
    pin_memory: true
    prefetch_factor: null
    sample_rate: 16000
    text_field: text
    lang_field: lang

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 1337
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse, set to 1
  # Eval does NOT go through Lhotse -- it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s, and eval
  # runs while the optimizer state of all three components is resident.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule: warmup, a long plateau, then a cosine decay to 0.1x peak over
  # the last fifth of the run. warmup_steps below 1 is a fraction of max_steps
  # (transformers 5). num_decay_steps is an absolute step count that depends on
  # the run's length, so the LAUNCHER sets it (max_steps / 5, as launch_step2.sh
  # does with --trainer.lr_scheduler_kwargs.num_decay_steps); the scheduler
  # refuses to build without it, so it cannot be forgotten silently.
  lr_scheduler_type: warmup_stable_decay
  warmup_steps: 0.05
  lr_scheduler_kwargs:
    min_lr_ratio: 0.1
    decay_type: cosine

  # Duration: one pass over total_hours, steps DERIVED rather than pinned. The
  # launcher pins max_steps (see the data.train_ds stats comment for the formula).
  num_train_epochs: 1
  max_steps: -1

  # Logging
  logging_strategy: steps
  logging_steps: 5
  report_to: wandb

  # Evaluation
  eval_strategy: steps
  eval_steps: 500
  batch_eval_metrics: true

  # Evaluation decodes with generate() -- greedy, at most this many *new*
  # tokens (MELT's prompt is audio, so generation_max_length is read as a
  # new-token budget; see MELTTrainer._generation_kwargs).
  predict_with_generate: true
  generation_max_length: 256
  generation_num_beams: 1

  # Checkpointing. All three components train, so a checkpoint carries weights
  # and AdamW state for ~3.7 B parameters (tens of GB): keep few.
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 2

  # Performance
  bf16: true
  dataloader_num_workers: 4  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true
  # Reference/hypothesis pairs printed to stdout and logged to W&B each eval.
  # 0 disables.
  log_num_samples: 10

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95
  encoder_lr: 6e-6
  adapter_lr: 2e-4
  decoder_lr: 2e-5
  # Not read by the trainer: the schedule's floor is
  # trainer.lr_scheduler_kwargs.min_lr_ratio. Kept for parity with SFT-v1.4.0.
  min_lr_scale: 0.1
