        tags:
          task: asr
          lang: ga
          text_field: custom.metadata.sentence
        # 0.6 h, 526 cuts held out
      - type: lhotse_shar
        name: asr_hr
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/fleurs/hr_hr/validation
        tags:
          task: asr
          lang: hr
          text_field: custom.pnc_text
        # 1.0 h, 377 cuts held out
      - type: lhotse_shar
        name: asr_hu
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/hu/validation
        tags:
          task: asr
