        name: asr_cs
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/cs/validation
        tags:
          task: asr
          lang: cs
          text_field: custom.metadata.sentence
        # 12.0 h, 9,410 cuts held out
      - type: lhotse_shar
        name: asr_da
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/da/validation
        tags:
          task: asr
          lang: da
          text_field: custom.metadata.sentence
        # 3.4 h, 2,630 cuts held out
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/validation
        tags:
          task: asr
          lang: de
          text_field: custom.metadata.sentence
        # 2.5 h, 1,897 cuts held out
      - type: lhotse_shar
        name: asr_el
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/el/validation
        tags:
          task: asr
          lang: el
          text_field: custom.metadata.sentence
        # 1.9 h, 1,694 cuts held out
      - type: lhotse_shar
        name: asr_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/en/validation
        tags:
          task: asr
          lang: en
          text_field: custom.metadata.sentence
        # 27.3 h, 16,401 cuts held out
      - type: lhotse_shar
        name: asr_es
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/es/validation
        tags:
          task: asr
          lang: es
          text_field: custom.metadata.sentence
        # 26.8 h, 15,893 cuts held out
      - type: lhotse_shar
        name: asr_et
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/et/validation
        tags:
          task: asr
          lang: et
          text_field: custom.metadata.sentence
        # 5.2 h, 2,823 cuts held out
      - type: lhotse_shar
        name: asr_fi
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/fi/validation
        tags:
          task: asr
          lang: fi
          text_field: custom.metadata.sentence
        # 2.2 h, 1,767 cuts held out
      - type: lhotse_shar
        name: asr_fr
