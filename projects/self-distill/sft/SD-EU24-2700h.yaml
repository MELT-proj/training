            # 2.4 h of 2.4 h in cv22_sidon, mean cut 4.5 s
    # Stats. total_hours is the HOURS THE MIX DRAWS (not the size of the pools it
    # draws from), and total_cuts the matching number of cuts; the trainer turns
    # total_hours into steps per epoch:
    #
    #   steps = total_hours * 3600 / (batch_duration * world_size * grad_accum)
    #
    # The launcher pins max_steps from that and sets num_decay_steps = max_steps / 5.
    # Batches fill to less than batch_duration, so the audio a run really sees is
    # the train_hours counter in its log, not steps x batch_duration x world_size.
    total_hours: 2700.00
    total_cuts: 1302073
    force_estimate: false

    # Duration filtering
    min_duration: 0.5
    max_duration: 60.0

    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    # Placeholder. Seconds of audio per rank per micro-batch; the smoke test
    # fixes the value that fits (encoder, adapter and decoder all train here).
    batch_duration: 60
    # Deliberately unset: lhotse would charge each cut d + d^2/q, so batch_duration
    # would budget effective seconds and the derived step count would no longer be
    # the true number of batches (#96). Unset, the charge is exactly d.
    quadratic_duration: null

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    buffer_size: 10000
    # Measured on THIS draw (per-source duration histograms x the weights below,
    # cuts outside [min_duration, max_duration] removed), by build_sft_mix.py.
    # A stale set is an OOM, not a throughput nuisance: RE-MEASURE THEM WHENEVER
    # the mix or max_duration changes (build_sft_mix.py does it on every render).
    bucket_duration_bins: [2.02, 3.1, 3.89, 4.46, 5.0, 5.58, 6.1, 6.73, 7.36, 8.06, 8.92, 9.78, 10.58, 11.4, 12.22, 13.06, 13.94, 14.82, 15.76, 16.74, 17.76, 18.85, 20.0, 21.92, 24.5, 27.68, 32.94, 36.72, 38.6]

    # Drop cuts whose transcript is pathologically long for their audio: batches
    # are budgeted by audio seconds, so a short cut with a runaway transcript still
    # sets the padded width of the whole batch (that is what ended an earlier run
    # at 77 GB on an 80 GB card). Cuts without custom.num_tokens are kept, not
    # dropped, so this can never remove a source; it is blind on the ones that
    # lack the field.
    max_tokens: 400

    # Sampling
    shuffle: true
    drop_last: false
    seed: 1337
    # A fixed scalar, not 'randomized': with indexed sources the partitioning
    # already separates the per-(rank, worker) streams, and the loader ignores
    # 'randomized' and falls back to `seed` with a warning anyway.
    shard_seed: 1337

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    # Generation-based evaluation costs ~N sequential decoder steps per sample
    # instead of a single forward, so the full validation set is not affordable.
    #
    # NOTE this cap is applied PER NAMED EVAL SET, not per config: every set below
    # is named, so a run reports eval_<name>_loss (plus WER/CER) per set, and each
    # set scores 20 clips. materialize_cuts_for_eval applies the cap with a seeded
    # shuffle, so every run, and both data conditions, score the same clips.
    max_samples: 20
    input_cfg:
      - type: lhotse_shar
        name: asr_bg
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/bg/validation
        tags:
          task: asr
          lang: bg
          text_field: custom.metadata.sentence
        # 4.6 h, 2,932 cuts held out
