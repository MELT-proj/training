          text_field: custom.metadata.sentence
        # 17.0 h, 11,604 cuts held out
      - type: lhotse_shar
        name: asr_it
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/it/validation
        tags:
          task: asr
          lang: it
          text_field: custom.metadata.sentence
        # 25.4 h, 15,179 cuts held out
      - type: lhotse_shar
        name: asr_lt
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/lt/validation
        tags:
          task: asr
          lang: lt
          text_field: custom.metadata.sentence
        # 7.1 h, 5,111 cuts held out
      - type: lhotse_shar
        name: asr_lv
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/lv/validation
        tags:
          task: asr
          lang: lv
          text_field: custom.metadata.sentence
        # 12.3 h, 7,705 cuts held out
      - type: lhotse_shar
        name: asr_mt
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/mt/validation
        tags:
          task: asr
          lang: mt
          text_field: custom.metadata.sentence
        # 2.1 h, 1,625 cuts held out
      - type: lhotse_shar
        name: asr_nl
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/nl/validation
        tags:
          task: asr
          lang: nl
          text_field: custom.metadata.sentence
        # 16.0 h, 12,032 cuts held out
      - type: lhotse_shar
        name: asr_pl
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/pl/validation
        tags:
          task: asr
          lang: pl
          text_field: custom.metadata.sentence
        # 14.2 h, 9,856 cuts held out
      - type: lhotse_shar
        name: asr_pt
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/pt/validation
        tags:
          task: asr
          lang: pt
          text_field: custom.metadata.sentence
        # 12.0 h, 9,640 cuts held out
      - type: lhotse_shar
        name: asr_ro
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/ro/validation
        tags:
          task: asr
          lang: ro
          text_field: custom.metadata.sentence
        # 4.2 h, 3,918 cuts held out
      - type: lhotse_shar
        name: asr_sk
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/sk/validation
        tags:
          task: asr
          lang: sk
          text_field: custom.metadata.sentence
        # 5.8 h, 5,007 cuts held out
      - type: lhotse_shar
        name: asr_sl
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/sl/validation
        tags:
          task: asr
          lang: sl
          text_field: custom.metadata.sentence
        # 1.5 h, 1,331 cuts held out
      - type: lhotse_shar
        name: asr_sv
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/sv-SE/validation
        tags:
          task: asr
          lang: sv
          text_field: custom.metadata.sentence
        # 6.1 h, 5,420 cuts held out
    # Statistics: the full held-out sets, before max_samples. Both data conditions
    # render this block identically.
    total_hours: 235.52
    total_cuts: 159826
    force_estimate: true

    # data.strict_text_field is not inherited by eval (resolve_eval_data_config
    # only carries apply_chat_template/prompt_template/*/chat_template_config),
    # so it is set explicitly here to match training. skip_text_field_mismatch
    # travels the same path.
    strict_text_field: true
    skip_text_field_mismatch: true

    # Eval prompt: PINNED, one instruction for every clip, eval step and run, so eval_<name>_loss
    # and the WER/CER only move when the model does. It is the instruction the student is distilled
    # under (the repeat one), so the in-training WER measures what the training objective teaches;
    # the launcher passes the same string. The scored comparison against the SFT runs is made
    # afterwards, by melt-eval, under each model's own and under a shared prompt.
    prompt_template_selection: custom
    # One string, not the per-task mapping of the SFT template: the launcher overrides it, and a
    # string over a mapping would not merge.
    prompt_template: "Repeat the following content exactly, word for word, and write nothing else.\n\n{audio_token}"

    # Batch composition
    batch_size: 16
    batch_duration: null

    buffer_size: 20000
    shuffle: false
    drop_last: true
    min_duration: 0.5
    # Matches train.
    max_duration: 60.0
    num_workers: 0
    pin_memory: true
    prefetch_factor: null
    sample_rate: 16000
    text_field: text
    lang_field: lang

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 1337
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse, set to 1
  # Eval does NOT go through Lhotse -- it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s, and eval
  # runs while the optimizer state of all three components is resident.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule: warmup, a long plateau, then a cosine decay to 0.1x peak over
  # the last fifth of the run. warmup_steps below 1 is a fraction of max_steps
  # (transformers 5). num_decay_steps is an absolute step count that depends on
  # the run's length, so the LAUNCHER sets it (max_steps / 5, as launch_step2.sh
  # does with --trainer.lr_scheduler_kwargs.num_decay_steps); the scheduler
  # refuses to build without it, so it cannot be forgotten silently.
  lr_scheduler_type: warmup_stable_decay
  warmup_steps: 0.05
  lr_scheduler_kwargs:
    min_lr_ratio: 0.1
    decay_type: cosine

  # Duration: one pass over total_hours, steps DERIVED rather than pinned. The
  # launcher pins max_steps (see the data.train_ds stats comment for the formula).
  num_train_epochs: 1
  max_steps: -1

  # Logging
  logging_strategy: steps
  logging_steps: 5
  report_to: wandb

  # Evaluation
  eval_strategy: steps
  eval_steps: 500
  batch_eval_metrics: true

  # Evaluation decodes with generate() -- greedy, at most this many *new*
  # tokens (MELT's prompt is audio, so generation_max_length is read as a
  # new-token budget; see MELTTrainer._generation_kwargs).
  predict_with_generate: true
  generation_max_length: 256
  generation_num_beams: 1

  # Checkpointing. All three components train, so a checkpoint carries weights
  # and AdamW state for ~3.7 B parameters (tens of GB): keep few.
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 2

  # Performance
  bf16: true
  dataloader_num_workers: 4  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true
  # Reference/hypothesis pairs printed to stdout and logged to W&B each eval.
  # 0 disables.
  log_num_samples: 10

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95
  encoder_lr: 6e-6
  adapter_lr: 2e-4
  decoder_lr: 2e-5
  # Not read by the trainer: the schedule's floor is
  # trainer.lr_scheduler_kwargs.min_lr_ratio. Kept for parity with SFT-v1.4.0.
  min_lr_scale: 0.1
