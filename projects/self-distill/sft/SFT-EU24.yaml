# SFT-EU24 -- supervised fine-tuning of Whisper-large-v3 + MLP adapter (stack_factor 5) + Qwen3.5-2B,
# all three components trainable.
#
# Data condition 2 of 2, EU24: all 24 EU languages at HR5's total (6,132.6 h). Every entry draws
# min(c, what it holds) with the common cap c = 197.741 h, solved by bisection so that the total
# equals HR5's; entries below c use all their data. One ASR entry per language, one X->en entry per
# language with data (yodas-granary ast, CoVoST2), one en->X entry per target with data (CoVoST2,
# Europarl-ST). Same corpus split inside an entry as HR5.
#
# TOTAL HOURS: 6,132.6 h over 57 entries (data.train_ds.total_hours). The launcher derives
# max_steps from it; HR5 and EU24 draw the same total, so they get the same compute.
#
# Rendered by projects/self-distill/sft/build_sft_mix.py from SFT-template.yaml. Both conditions are
# rendered together, because EU24's cap depends on HR5's total. Do not hand-edit: change the template
# or the script and render again. The script has read a sample of cuts from every source below and
# resolved each text_field the way the loader does; it refuses to render if one does not resolve.
#
# Left out of the mix (build_sft_mix.EXCLUDED):
#   voxpopuli/hr/train: 47.2% of its cuts (17.0 of 34.8 h) have no transcript, so about half of every draw
#   would be skipped by the loader; its validation and test splits are the same (38.6% and 49.8%).
#
# In the mix with a caveat (the reason is repeated beside each source):
#   fleurs/ga_ie/train: no pnc_text (no custom block at all), so it trains on the unpunctuated supervision
#   text; it is 12 h of Irish against 0.6 h of CV22. Under strict_text_field the corpus-wide custom.pnc_text
#   would raise on every cut.
#   voxpopuli/{cs,et,fi,hu,lt,nl,pl,ro,sk,sl}/train: went through a generic converter (positional
#   chunk{N}_item{M} ids that collide across languages, no filter on empty transcripts). 0.2-4.8% of their
#   cuts have no transcript; the loader skips those (there is no text to mislabel) and their batch slots are
#   wasted.
#
# Validation is the same in both conditions: 20 clips per named set from splits no training source
# reads. asr_hr is scored on FLEURS because CV22 has no Croatian and 38.6% of VoxPopuli hr
# validation cuts have no transcript (max_samples is applied before they are dropped).
#
# Hours are the unfiltered durations of the manifests, as everywhere else in this repo; the loader
# then drops cuts outside [min_duration, max_duration].

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: SFT-EU24
  dry_run: false
  # One forward+backward at max_duration and one at min_duration before step 1,
  # logging peak CUDA memory for each. All three components train here, so this
  # is what turns "does batch_duration fit" into a number in the first minute.
  # An OOM in the warmup pass is caught and warned about rather than fatal.
  memory_preallocation: true

# =============================================================================
# Model Configuration
# =============================================================================
# The launcher sets model.ckpt (the warm start) and the stack from the checkpoint
# and plan_arm's tables; the values below describe the same stack so the file
# also reads right on its own. While model.ckpt is set the architecture comes
# from the checkpoint, but attn_implementation is still read from here.
model:
  encoder:
    name: openai/whisper-large-v3
    freeze: false
    max_audio_seq_len: 3000 # Whisper takes exactly 30 s of 10 ms mel frames
    attn_implementation: flash_attention_2
    apply_spec_augment: false

  decoder:
    name: Qwen/Qwen3.5-2B
    attn_implementation: flash_attention_2
    freeze: false
    eos_token: <|endoftext|>
    pad_token: <|text_pad|>
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>

  adapter:
    _type: mlp
    freeze: false
    stack_factor: 5

  ckpt: null # IMPORTANT: set by the launcher (the warm-start checkpoint)

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000

  # Instruction formatting: one prompt per cut, drawn at random from the task's
  # family in melt/training/data/audio/lhotse/helpers.py TASK_TEMPLATES (the ST
  # family names the TARGET language, so X->en reads "... to English" and en->X
  # "... to German"). Validation inherits this, so in-training eval also draws
  # a random prompt per clip.
  apply_chat_template: true
  prompt_template_selection: random
  # Qwen 3 / 3.5 boundary markers; checked against the tokenizer at startup.
  chat_template_config: chatml

  # A configured text_field that resolves to nothing raises instead of silently
  # falling back to the supervision text (which holds different content for
  # every ST source and for cv22_sidon, whose supervision is empty).
  strict_text_field: true
  # Turns the one case strict mode would raise on -- a field empty on a cut that
  # has other text -- into a logged warning and a skipped cut. Needed because one
  # such cut (yodas-granary French ast, 1 in 4,000 of its shard) once took down
  # a whole distributed run, and a resume reaches the same cut again. The build
  # script audits every source and refuses to render one where this happens on
  # more than 0.1% of the sampled cuts, so it can only ever absorb stray cuts.
  skip_text_field_mismatch: true

  train_ds:
    input_cfg:
      # `weight` is a per-CUT draw probability: lhotse's mux picks one cut per draw, so a source's
      # share of the audio is weight x its mean cut length. Each weight is the share of the cuts
      # that make up the hours listed beside it (hours / mean cut), so those hours are what a run
      # draws (build_sft_mix.py, compute_mix_weights.cut_mux_weights). A group's weight is its
      # entry's share of the cuts, a child's weight its share within the entry; the two levels are
      # muxed separately, so do NOT pre-multiply them.
      # 57 entries, 6,132.6 h. Common cap c = 197.7415 h.
      # ASR de: 197.7 h (capped, of 11,128.2 h); 3.1% of the cuts, 3.2% of the audio
      - type: group
        weight: 0.0307773818
        tags:
          task: asr
          lang: de
        input_cfg:
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/ast
            weight: 0.4065007058
            tags:
              task: asr
              lang: de
            # 83.9 h of 7,429.1 h in yodas-granary, mean cut 8.0 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/german/train
            weight: 0.1113296695
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 43.2 h of 1,966.5 h in mls_sidon, mean cut 15.1 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/train
            weight: 0.2058154804
            tags:
              task: asr
              lang: de
              text_field: custom.metadata.sentence
            # 30.2 h of 962.7 h in cv22_sidon, mean cut 5.7 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/yodas-granary/German/asr_only
            weight: 0.1958402446
            tags:
              task: asr
              lang: de
            # 21.7 h of 496.2 h in yodas-granary, mean cut 4.3 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/train
            weight: 0.0700543724
            tags:
              task: asr
              lang: de
              text_field: custom.pnc_text
            # 15.8 h of 264.6 h in voxpopuli, mean cut 8.8 s
          - type: lhotse_shar
            shar_path: ${oc.env:LOCAL_DATASETS_DIR}/fleurs/de_de/train
            weight: 0.0104595273
            tags:
