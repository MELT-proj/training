# fsdp2.yaml, with resharding after forward turned OFF.
#
# fsdp_reshard_after_forward: false keeps parameters gathered between forward
# and backward instead of re-all-gathering them, trading memory for
# communication.  Measured on artemis (2x H100, 300 steps, job 327901 vs the
# 327899 baseline): +28% throughput, at a memory cost this workload can afford
# -- the ABL runs sit around 28 GB of 80 GB, because the encoder and decoder are
# both frozen and only the adapter trains.
#
# Use this for the ABL-* modality-alignment runs.  For a workload that actually
# needs the sharding (a trainable decoder, or a bigger model), stay on
# fsdp2.yaml.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
enable_cpu_affinity: false
fsdp_config:
  fsdp_activation_checkpointing: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_reshard_after_forward: false
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_version: 2
main_training_function: main
mixed_precision: bf16
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
