# Plain DDP: one full replica of the model per rank, no sharding.
#
# Why not FSDP here.  In the MA arm only the adapter trains -- 6.3 M of ~1.8 B
# parameters (w2v-BERT 0.58 B + Llama-3.2-1B 1.24 B), both backbones frozen.
# FSDP shards *parameters*, but the state that sharding actually saves --
# gradients and optimizer moments -- exists only for those 6.3 M params and
# comes to roughly 75 MB.  Sharding the frozen 1.8 B saves about 3.2 GB per rank
# on a 64 GB H100, ~5% of the card, and charges an all-gather of the whole model
# on every forward to get it.  That is the wrong trade, and it is why the FSDP2
# runs left more than half the GPU memory empty.
#
# It also cannot be expressed in FSDP2 anyway: with `fsdp_version: 2` accelerate
# takes `reshard_after_forward` as a bool and torch's FSDP2 has no NO_SHARD, so
# "one full replica per rank" simply is DDP.
#
# Two consequences worth knowing:
#   * No activation checkpointing.  fsdp2.yaml turned it on
#     (`fsdp_activation_checkpointing: true`), i.e. it recomputed every
#     activation to buy back memory we are not short of.  There is no
#     equivalent here, and HF's `gradient_checkpointing` defaults to false, so
#     activations are kept.  This is the single biggest speed difference.
#   * Saving works normally.  Trainer.save_model writes a real
#     model.safetensors instead of the sharded no-op of issue #91, so a
#     completed run needs no merge step.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
enable_cpu_affinity: false
main_training_function: main
mixed_precision: bf16
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
