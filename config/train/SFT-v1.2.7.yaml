          tgt_lang: en

    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    batch_duration: 480  # seconds of audio per batch
    quadratic_duration: 20 # see https://lhotse.readthedocs.io/en/latest/datasets.html#lhotse.dataset.sampling.TimeConstraint

    # Bucketing for efficient batching
    use_bucketing: true
    num_buckets: 30
    bucket_buffer_size: 10000
    bucket_duration_bins: [3.42, 3.88, 4.18, 4.44, 4.68, 4.87, 5.06, 5.23, 5.4, 5.58, 5.76, 5.9, 6.08, 6.24, 6.41, 6.6, 6.8, 7.01, 7.22, 7.46, 7.75, 8.09, 8.5, 9.1, 10.1, 12.67, 14.12, 15.06, 15.9]

    # Sampling
    shuffle: true
    shuffle_buffer_size: 10000
    drop_last: false
    seed: 42
    shard_seed: randomized

    # Duration filtering
    min_duration: 0.5
    max_duration: 1800.0 # 30 minutes

    # DataLoader settings
