datasets:
- librispeech
- peoples_speech
- mls
- cv16.1
selected_langs:
- en
- de
- it
- zh-CN
- zh-HK
- zh-TW
dataset_workers: 8

audio_encoder: facebook/w2v-bert-2.0
text_decoder: Qwen/Qwen2.5-0.5B

training_args:
  output_dir: $SCRATCH/speech_lm/models/w2v-qwen25-05_align-iwslt
  seed: 42
  do_train: true
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 2
  adam_beta1: 0.9
  adam_beta2: 0.95
  num_train_epochs: 1
  lr_scheduler_type: cosine
  warmup_steps: 2000
  logging_strategy: steps
  logging_steps: 25
  report_to: wandb
  do_eval: true
  eval_strategy: steps
  eval_steps: 3000
  # eval_on_start: true
  save_strategy: steps
  save_total_limit: 5
  save_steps: 1000
  dataloader_num_workers: 4
  remove_unused_columns: false
  bf16: true
  group_by_length: true
  # eval_on_start: true
  # include_tokens_per_second: true

encoder_lr: 6e-6
decoder_lr: 2e-5
adapter_lr: 2e-4
min_lr_scale: 0.1
use_flash_attention_2: true

val_samples_per_language: 3000

encoder_params:
  add_adapter: false
  adapter_kernel_size: 3
  adapter_stride: 2  # about .5 compression ratio
  num_adapter_layers: 2

