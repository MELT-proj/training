    # Stats
    total_hours: 245099.2
    total_cuts: 91330322
    force_estimate: false

    # Duration filtering
    min_duration: 0.5
    max_duration: 120.0
    
    # Batch settings
    batch_size: null  # Use batch_duration instead for dynamic batching
    batch_duration: 90  # seconds of audio per batch
    quadratic_duration: 30 # see https://lhotse.readthedocs.io/en/latest/datasets.html#lhotse.dataset.sampling.TimeConstraint

    # Bucketing for efficient batching
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    buffer_size: 10000
    bucket_duration_bins: [2.42, 3.6, 4.54, 5.41, 6.26, 7.18, 8.24, 9.52, 10.64, 11.64, 12.61, 13.56, 14.42, 14.89, 15.62, 16.58, 17.58, 18.58, 19.64, 21.6, 23.92, 26.18, 28.44, 31.7, 34.9, 36.4, 37.5, 38.42, 39.24]

    # Sampling
    shuffle: true
    drop_last: false
    seed: 42
    # A scalar here is one value shared by every process, so every DDP rank
    # resolves the same RNG and yields the same batch sequence. 'randomized'
    # resolves per rank and worker while staying reproducible across runs.
    shard_seed: randomized

    # DataLoader settings
    num_workers: 1
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

