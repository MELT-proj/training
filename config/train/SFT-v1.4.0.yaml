# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 42
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse, set to 1
  # Eval does NOT go through Lhotse — it uses a plain DataLoader, and -1 here
  # crashes the first eval. 4 is known-good; 16 OOMs on 64 GB H100s.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule
  lr_scheduler_type: cosine
  warmup_steps: 20

  # Duration
  num_train_epochs: 2
  max_steps: -1

  # Logging
  logging_strategy: steps
  logging_steps: 5
  report_to: wandb

  # Evaluation
  eval_strategy: steps # "no" # steps
  eval_steps: 100
  batch_eval_metrics: true

  # Evaluation decodes with generate() -- greedy, at most this many *new*
  # tokens (MELT's prompt is audio, so generation_max_length is read as a
  # new-token budget; see MELTTrainer._generation_kwargs).
  predict_with_generate: true
  generation_max_length: 256
  generation_num_beams: 1

  # Checkpointing
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 5

  # Performance
  bf16: true
  group_by_length: false
  dataloader_num_workers: 4  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true
  # Reference/hypothesis pairs printed to stdout and logged to W&B each eval.
  # 0 disables.
  log_num_samples: 10

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95
  encoder_lr: 6e-6
  decoder_lr: 2e-5
  adapter_lr: 2e-4
  min_lr_scale: 0.1
