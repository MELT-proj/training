# MELT Training Configuration — modality alignment (MA) on three VoxPopuli languages
#
# Stage 1 of two. Only the adapter trains: the encoder and the decoder are both
# frozen. The IFT stage afterwards starts from this run's checkpoint by setting
# `model.ckpt` to this run's output directory.
#
# Languages: de, es, fr. Chosen because they are three of the five VoxPopuli
# languages that went through the dedicated `voxpopuli.py` converter (de, en,
# es, fr, it). The other eleven went through the generic HF->Shar batch
# converter and carry no `custom` block: no `num_tokens`, positional fallback
# IDs that collide across corpora, and unfiltered empty transcripts (`hr` is
# ~47% textless). Do not add a language to this mix without checking it first.
#
# English is deliberately left out: at 522.6 h it would be 53% of the mix on its
# own and would dominate the per-language metrics.
#
# Measured on MN5 over the shar tree, not estimated:
#
#   split          cuts       hours
#   de/train     108,473     264.61
#   es/train      50,922     151.93
#   fr/train      73,561     205.70
#   -------------------------------
#   total        232,956     622.24
#
#   de/validation  2,109       4.98
#   es/validation  1,631       5.13
#   fr/validation  1,727       4.96
#   -------------------------------
#   total          5,467      15.07
#
# Steps per epoch, so you can size `max_steps`: 622.24 h at `batch_duration`
# 160 s is ~14,000 batches; over 4 GPUs that is ~3,500 per rank, and at
# `gradient_accumulation_steps` 4 that is **~875 optimizer steps per epoch**.
# `max_steps 2000` is therefore ~2.3 epochs. Note that the trainer's own epoch
# counter is known to be wrong by a config-dependent factor (issue #46), so
# govern the run with `max_steps` and treat the epoch axis as unreliable.
#
# Usage: see docs/hpc_runbook.md §B3. The short version, from ~/training on MN5:
#
#   EXP=MA-VP3-de-es-fr-v1.0
#   MY=/gpfs/scratch/epor48/$USER
#
#   LOCAL_DATASETS_DIR=/gpfs/projects/epor48/melt-data/shar-indexed \
#   SINGULARITY_IMG=/gpfs/scratch/epor48/melt_cuda126_lhotse2_td.sif \
#   OUTPUT_DIR=$MY/outputs TMPDIR_HOST=$MY/tmp \
#   MELT_QOS=acc_ehpc MELT_TIME=12:00:00 \
#   infra/runners/submit-container.sh mn5 config/accelerate/fsdp2.yaml \
#     --config config/train/MA-VP3-v1.0.yaml \
#     --trainer.max_steps 2000 \
#     --trainer.output_dir /workspace/outputs/$EXP \
#     --run.exp_name $EXP
#
# Smoke-test any change first with `--trainer.max_steps 10
# --trainer.eval_on_start false` on the acc_debug QoS.

# =============================================================================
# Run Configuration (non-TrainingArguments settings)
# =============================================================================
run:
  exp_name: MA-VP3-de-es-fr-v1.0
  dry_run: false

# =============================================================================
# Model Configuration
# =============================================================================
model:
  encoder:
    name: facebook/w2v-bert-2.0
    freeze: true
    max_audio_seq_len: 1500 # for frames of 20ms, this is 30s

  decoder:
    name: Qwen/Qwen3-1.7B
    attn_implementation: flash_attention_2
    freeze: true  # MA: the decoder stays fixed
    bos_token: <|startoftext|>
    eos_token: <|endoftext|>
    pad_token: <|text_pad|> # used if not specified in tokenizer
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>

  adapter:
    _type: conformer
    freeze: false  # MA: the adapter is the only thing that trains
    num_adapter_layers: 2
    adapter_kernel_size: 3
    adapter_stride: 2

  ckpt: null  # MA starts from scratch; the IFT stage points this at the MA output

# =============================================================================
# Data Configuration
# =============================================================================
data:
  sample_rate: 16000
  # Declared here, at `data.`, and inherited by validation_ds since 0.5.1 — the
  # training and eval paths now format text the same way, so eval_loss is
  # comparable to the training loss (issue #58). The loader logs the
  # inheritance at startup; seeing that line is the confirmation it worked.
  apply_chat_template: true
  min_chars: 3

  train_ds:
    # Data sources — VoxPopuli de/es/fr, from the INDEXED tree. `shar_path`
    # resolves under LOCAL_DATASETS_DIR, which must point at `shar-indexed`
    # (see `indexed:` below).
    input_cfg:
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/train
        tags:
          task: asr
          lang: de
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/train
        tags:
          task: asr
          lang: es
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/train
        tags:
          task: asr
          lang: fr

    # Stats — measured over the three splits above, not estimated.
    total_hours: 622.24
    total_cuts: 232956
    force_estimate: false

    # Duration filtering
    min_duration: 0.5
    max_duration: 90.0

    # Batch settings
    batch_size: 32       # cap on cuts per batch, applied alongside batch_duration
    batch_duration: 160  # seconds of audio per batch — the real batch-size lever
    quadratic_duration: 35
    # Effective here: de/es/fr carry `custom.num_tokens` on essentially every
    # cut (108469/108473, 50920/50922, 73534/73561). On a source without it
    # this cap is silently inert (issue #59), which is another reason to keep
    # the eleven generic-converter languages out of this mix.
    max_tokens: 256
    max_tps: null

    # Read the Shar sources through their .idx sidecars: partitioning is by
    # sample index across the (rank x worker) pool, so an epoch is exactly 100%
    # of the data and the sampler position survives a resume (issue #52).
    # `true` demands indexed sources and fails loudly on one that is not —
    # preferred over `null`, which would silently fall back to streaming if
    # LOCAL_DATASETS_DIR were pointed at the plain `shar` tree by mistake.
    indexed: true

    # Bucketing for efficient batching. Bins are left null so the sampler
    # estimates them from this data; a copied-over list would describe a
    # different duration distribution.
    lhotse_sampler_type: dynamic_bucketing  # One among: dynamic_bucketing, dynamic, bucketing
    num_buckets: 30
    # 50k, not the 300k used for the full multi-corpus mix: the sampler fills
    # this buffer before it emits a first batch, and 300k exceeds this mix's
    # 232,956 cuts outright. The big buffer cost 35 min of silent startup on
    # the campaign runs; this keeps that down while still shuffling widely.
    buffer_size: 50000
    bucket_duration_bins: null

    # Sampling
    shuffle: true
    drop_last: false
    seed: 42
    # A fixed scalar, not 'randomized': with indexed sources the partitioning
    # already separates the per-(rank, worker) streams, and the loader ignores
    # 'randomized' and falls back to `seed` with a warning anyway.
    shard_seed: 42

    # DataLoader settings
    # NOTE: a resumed run must keep (nodes x GPUs x num_workers) identical —
    # the sampler refuses to restore its state under a changed layout.
    num_workers: 2
    pin_memory: true
    prefetch_factor: 32
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    input_cfg:
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/validation
        tags:
          task: asr
          lang: de
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/validation
        tags:
          task: asr
          lang: es
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/fr/validation
        tags:
          task: asr
          lang: fr

    # Statistics — small enough that estimating costs nothing.
    total_hours: null
    total_cuts: null
    force_estimate: true

    # Batch composition
    batch_size: null
    batch_duration: 200.0
    quadratic_duration: 30
    # Inert here, and expect the issue-59 warning at startup: the VoxPopuli
    # validation and test splits carry no `custom.num_tokens` at all, in any
    # language. Left in place so it starts working if the data is backfilled.
    max_tokens: 256
    max_tps: null

    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    bucket_duration_bins: null
    buffer_size: 20000

    shuffle: false
    drop_last: false
    seed: 42
    shard_seed: 42  # inert while shuffle is false; fixed so eval order is stable

    min_duration: 0.5
    max_duration: 90.0
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    sample_rate: 16000
    text_field: text
    lang_field: lang

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 42
  do_train: true
  do_eval: true
  eval_on_start: true
  average_tokens_across_devices: true

  # Batch and accumulation
  per_device_train_batch_size: -1  # Handled by Lhotse
  # The eval path does not understand -1 and crashes at the first eval, so this
  # is set explicitly. 4 is known-good; 16 OOMs on 64 GB H100s.
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  # LR schedule
  lr_scheduler_type: cosine
  warmup_steps: 10

  # Duration — governed by max_steps from the CLI. `num_train_epochs` is left
  # at a nominal value because the epoch counter is unreliable (issue #46).
  num_train_epochs: 3
  max_steps: -1

  # Logging
  logging_strategy: steps
  logging_steps: 2
  report_to: wandb

  # Evaluation. Eval dominates wall-clock on short runs — three evals took ~71%
  # of a 60-step job — so keep eval_steps large when max_steps is small.
  eval_strategy: steps
  eval_steps: 500
  batch_eval_metrics: true

  # Checkpointing
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3

  # Performance
  bf16: true
  group_by_length: false  # Handled by Lhotse bucketing
  dataloader_num_workers: 0  # Eval-only knob (train workers come from data.train_ds.num_workers)
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

evaluation:
  compute_metrics: true
  enable_whisper_normalization: true

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95

  # Only adapter_lr is in play: encoder and decoder are frozen for MA.
  encoder_lr: 6e-6
  decoder_lr: 2e-5
  adapter_lr: 2e-4
  min_lr_scale: 0.1
