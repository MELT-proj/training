[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melt-proj"
version = "0.6.1"
description = "MELT project training utilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Giuseppe Attanasio", email = "gattanasio.work@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9,<2.10",
    "transformers==4.57.1",
    "wandb>=0.23",
    "datasets>=4.0",
    "omegaconf>=2.3",
    "librosa>=0.11",
    "soundfile>=0.13",
    "sentencepiece>=0.2",
    "accelerate>=1.0",
    "deepspeed>=0.18",
    # 2.0.0a3 is the first release carrying indexed Shar manifests (.idx
    # sidecars), which partition by sample index instead of by shard -- see
    # https://github.com/MELT-proj/training/issues/52. It is a pre-release, so
    # installers need `--pre` (uv: `--prerelease=allow`) to resolve it.
    "lhotse==2.0.0a3",
    # StatefulDataLoader snapshots each worker's position from inside the worker,
    # which is the only place a lhotse sampler's position exists once
    # num_workers > 0 -- see https://github.com/MELT-proj/training/issues/55.
    "torchdata>=0.11",
    "pyyaml>=6.0",
    "webdataset>=1.0",
    "scipy>=1.15",
    "jiwer>=4.0",
    "setuptools",
    "peft>=0.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]
flash-attn = [
    "flash-attn",
]

[tool.pytest.ini_options]
markers = [
    # Anything that has to reach the HuggingFace Hub for a config, a tokenizer
    # or a set of weights. GitHub CI deselects these (see
    # .github/workflows/ci.yml); run them somewhere with a warm HF cache.
    "hub: needs to download a config, tokenizer or weights from the HuggingFace Hub",
]

[tool.setuptools.packages.find]
# The top-level package is `melt` (i.e. `melt/__init__.py`), with
# subpackages like `melt.training`, `melt.modeling`, and `melt.evaluation`.
where = ["."]
include = ["melt*"]

[tool.ruff]
target-version = "py310"
line-length = 119

# Only consider Python files under melt/
# Patterns are relative to the repository root.
include = ["melt/**/*.py"]

# Optional: exclude things you never want Ruff to touch
exclude = [
  "melt/**/migrations",
  "build",
  "dist",
  ".venv",
  ".eggs",
]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "RUF013", "PERF102", "SIM", "UP", "FURB"]
ignore = ["C901", "E501", "E741"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["transformers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
torch = { index = "pytorch" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
