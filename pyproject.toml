[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melt-proj"
version = "0.1.0"
description = "MELT project training utilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Giuseppe Attanasio", email = "gattanasio.work@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "transformers==4.57.1",
    "wandb",
    "datasets",
    "tyro",
    "librosa",
    "soundfile",
    "sentencepiece",
    "accelerate",
    "deepspeed",
    "lhotse",
    "pyyaml",
    "setuptools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[tool.setuptools.packages.find]
# The repo uses a package named `src` (i.e. `src/__init__.py` exists), with
# subpackages like `src.training`, `src.modeling`, and `src.evaluation`.
#
# Therefore, package discovery must run from the repository root and include
# `src*` package names.
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 119

# Only consider Python files under src/
# Patterns are relative to the repository root.
include = ["src/**/*.py"]

# Optional: exclude things you never want Ruff to touch
exclude = [
  "src/**/migrations",
  "build",
  "dist",
  ".venv",
  ".eggs",
]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "RUF013", "PERF102", "SIM", "UP", "FURB"]
ignore = ["C901", "E501", "E741"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["transformers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
