[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melt-proj"
version = "0.1.0"
description = "MELT project training utilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Giuseppe Attanasio", email = "gattanasio.work@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "transformers==4.57.1",
    "wandb",
    "datasets",
    "tyro",
    "librosa",
    "soundfile",
    "sentencepiece",
    "accelerate",
    "deepspeed",
    "lhotse",
    "pyyaml",
    "setuptools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[tool.setuptools.packages.find]
# Only look inside the `src/` directory for packages and include *melt* packages.
# Previously `where = ["."]` and `include = ["src*"]` caused setuptools to treat
# the `src` directory itself as a package namespace (installing `src.melt`).
# Use `where = ["src"]` and include package names under `melt` so installed
# package files map to top-level `melt` instead of `src.melt`.
where = ["src"]
include = ["melt*"]

[tool.ruff]
target-version = "py310"
line-length = 119

# Only consider Python files under src/
# Patterns are relative to the repository root.
include = ["src/**/*.py"]

# Optional: exclude things you never want Ruff to touch
exclude = [
  "src/**/migrations",
  "build",
  "dist",
  ".venv",
  ".eggs",
]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "RUF013", "PERF102", "SIM", "UP", "FURB"]
ignore = ["C901", "E501", "E741"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["transformers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
