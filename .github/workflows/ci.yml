name: Tests

# Tests do NOT re-run on every push to a PR. They run once when the PR opens,
# and after that only on demand:
#
#   * comment `/test` on the pull request, or
#   * `gh workflow run ci.yml --ref <branch>`
#
# Rationale: a PR under active development pushed five commits and paid for five
# full runs of the same suite, and `main` has no required status checks, so those
# runs never gated anything. If you have already run `pytest tests/` yourself --
# on artemis, say, where LOCAL_DATASETS_DIR is set and nothing skips -- this is a
# clean-environment second opinion, not a gate. Don't sit and wait for it.
on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

# A burst of `/test` comments, or a reopen while a run is in flight, costs one
# run rather than several: the newer trigger cancels the older.
concurrency:
  group: tests-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # `/test` is honoured only on pull requests, and only from someone who
    # already has write access. This job checks out PR head code while
    # issue_comment hands it a token scoped to THIS repo, so letting an
    # arbitrary fork author trigger it would hand them that token.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/test') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write  # solely to react to the `/test` comment

    steps:
    - name: Acknowledge the /test comment
      if: github.event_name == 'issue_comment'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # A comment-triggered run is not attached to the PR head SHA, so it
        # never shows up as a check on the PR. Without this the commenter gets
        # no sign anything happened. Reaction now, result in the Actions tab.
        gh api -X POST \
          "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
          -f content=eyes

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # issue_comment fires against the default branch, so the PR's merge ref
        # has to be asked for by name -- otherwise `/test` quietly tests main
        # and reports a pass that says nothing about the PR.
        ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1 ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with pytest
      env:
        # Belt and braces with `-m "not hub"` below. A test that reaches the
        # Hub without carrying the marker fails here loudly, with a "couldn't
        # connect" error naming the repo, instead of quietly downloading
        # weights on every run and flaking when a transfer fails. The fix for
        # such a failure is to add `@pytest.mark.hub` to the test.
        HF_HUB_OFFLINE: "1"
      run: |
        # Deselect anything that needs weights, tokenizers or configs from the
        # HuggingFace Hub. A GitHub runner has a cold cache, so those tests
        # re-download hundreds of MB every run, and Xet-backed repos (gpt2,
        # Qwen3-1.7B) fail outright here -- `hf_xet` cannot complete a transfer
        # on this runner and raises `Permission denied (os error 13)`. Run them
        # where the HF cache is warm (nyx/artemis) with `pytest tests/`, or
        # `pytest tests/ -m hub` for just that set.
        pytest tests/ -v -m "not hub"
