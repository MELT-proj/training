# Accelerate config for the 2-node × 2-GPU-per-node FSDP2 integration test.
# Based on config/accelerate/fsdp2.yaml.
#
# num_machines and num_processes are set here as a documentation aid; the
# sbatch script overrides them at launch time via CLI flags
# (--num_machines / --num_processes).
#
# machine_rank and main_process_ip are ALWAYS specified at launch time (they
# differ per node) and must NOT be set in this file.
#
# fsdp_activation_checkpointing is disabled to keep the test fast.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
enable_cpu_affinity: false
fsdp_config:
  fsdp_activation_checkpointing: false
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_version: 2
main_training_function: main
mixed_precision: bf16
num_machines: 2
num_processes: 4
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
