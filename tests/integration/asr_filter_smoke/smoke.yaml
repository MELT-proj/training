# ASR score band smoke: ASR sources with different bands/phases next to ST sources.
# See README.md. Model/optimizer as in tests/integration/lhotse2_campaign.

run:
  exp_name: asr-filter-smoke
  dry_run: false

model:
  encoder:
    name: facebook/w2v-bert-2.0
    freeze: true
    max_audio_seq_len: 1500

  decoder:
    name: Qwen/Qwen3-1.7B
    attn_implementation: flash_attention_2
    freeze: true
    bos_token: <|startoftext|>
    eos_token: <|endoftext|>
    pad_token: <|text_pad|>
    audio_token: <|audio|>
    audio_bos_token: <|audio_bos|>
    audio_eos_token: <|audio_eos|>

  adapter:
    _type: conformer
    freeze: false
    num_adapter_layers: 2
    adapter_kernel_size: 3
    adapter_stride: 2

  ckpt: null

data:
  sample_rate: 16000
  apply_chat_template: true
  min_chars: 3

  train_ds:
    # Per-source ASR bands. The rule's default is a two-phase band; sources
    # override it, or opt out. The rule matches task asr, so ST sources carry
    # no filter at all.
    cut_filter:
      scores_root: ${oc.env:LOCAL_ASR_SCORES_DIR}
      rules:
        asr_wer:
          match: {task: asr}
          array: wer
          missing: drop
          phases:
            - {from_step: 0,  min: 0.10, max: 0.40}
            - {from_step: 25, min: 0.00, max: 0.10}
    input_cfg:
      # default phases (absolute band, switches at step 25)
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/train
        weight: 0.25
        tags: {task: asr, lang: de}
      # own phases: any error up to 0.3, then only perfect matches
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/cv22_sidon/de/train
        weight: 0.15
        tags: {task: asr, lang: de, text_field: custom.metadata.sentence}
        cut_filter:
          asr_wer:
            phases:
              - {from_step: 0,  min: 0.01, max: 0.30}
              - {from_step: 25, min: 0.00, max: 0.00}
      # one static band, no phases
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/mls_sidon/dutch/train
        weight: 0.15
        tags: {task: asr, lang: nl, text_field: custom.pnc_text}
        cut_filter: {asr_wer: {min: 0.00, max: 0.05}}
      # exempt
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/es/train
        weight: 0.10
        tags: {task: asr, lang: es}
        cut_filter: false
      # ST: untouched
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/nl_en/train
        weight: 0.20
        tags: {task: st, src_lang: nl, tgt_lang: en}
      - type: lhotse_shar
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/it_en/train
        weight: 0.15
        tags: {task: st, src_lang: it, tgt_lang: en}

    total_hours: null
    total_cuts: null
    force_estimate: true

    min_duration: 0.5
    max_duration: 90.0

    batch_size: 32
    batch_duration: 160
    quadratic_duration: 35
    max_tokens: 256
    max_tps: null

    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    buffer_size: 300
    # Explicit: left null, the sampler reads 10,000 shuffled cuts with their audio in the
    # main process to estimate bins, which does not finish on these sources.
    bucket_duration_bins: [2.62, 3.6, 4.2, 4.7, 5.14, 5.54, 5.96, 6.38, 6.86, 7.42, 8.14, 9.2, 10.5, 11.67, 12.8, 13.89, 14.96, 16.0, 17.06, 18.13, 19.22, 20.46, 23.44, 26.5, 29.64, 34.68, 36.76, 38.12, 39.1]

    shuffle: true
    drop_last: false
    seed: 42
    shard_seed: 42

    num_workers: 2
    pin_memory: true
    prefetch_factor: 8
    sample_rate: 16000
    text_field: text
    lang_field: lang

  validation_ds:
    # `name` groups sources into separately reported eval sets, giving
    # eval_<name>_loss per language and per task. Per-task figures are the
    # mean over the asr_* and st_* sets.
    input_cfg:
      - type: lhotse_shar
        name: asr_de
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/voxpopuli/de/validation
        tags:
          task: asr
          lang: de
      - type: lhotse_shar
        name: st_nl_en
        shar_path: ${oc.env:LOCAL_DATASETS_DIR}/covost2/nl_en/dev
        tags:
          task: st
          src_lang: nl
          tgt_lang: en

    # The eval collator resolves apply_chat_template / prompt_template_selection
    # / chat_template_config from THIS config, not from `data`. Left unset they
    # default to False/"random"/"chatml", which would format eval text as bare
    # "{audio_token}{t}" while training uses the chat template — a validation
    # loss computed over a different sequence format than the training loss is
    # not comparable to it. Set them here so the two match.
    apply_chat_template: true
    prompt_template_selection: random
    chat_template_config: chatml

    # Applied per named set, not once across the concatenation.
    max_samples: 100

    total_hours: null
    total_cuts: null
    force_estimate: true

    batch_size: null
    batch_duration: 200.0
    quadratic_duration: 30
    max_tokens: 256
    max_tps: null

    lhotse_sampler_type: dynamic_bucketing
    num_buckets: 30
    bucket_duration_bins: null
    buffer_size: 20000

    shuffle: false
    drop_last: false
    seed: 42
    shard_seed: 42

    min_duration: 0.5
    max_duration: 90.0
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    sample_rate: 16000
    text_field: text
    lang_field: lang

trainer:
  output_dir: ${oc.env:OUTPUT_DIR}
  overwrite_output_dir: false
  resume_from_checkpoint: null
  seed: 42
  do_train: true
  do_eval: true
  eval_on_start: false
  average_tokens_across_devices: true

  per_device_train_batch_size: -1
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4

  lr_scheduler_type: cosine
  warmup_steps: 100

  num_train_epochs: 1
  max_steps: 40

  logging_strategy: steps
  logging_steps: 20
  report_to: wandb

  eval_strategy: steps
  eval_steps: 2000
  # batch_eval_metrics only matters with compute_metrics, which is off here.

  save_strategy: steps
  save_steps: 500
  save_total_limit: 3

  bf16: true
  group_by_length: false
  dataloader_num_workers: 0
  remove_unused_columns: false
  ddp_find_unused_parameters: false

  max_grad_norm: 1.0

# No `evaluation:` section. Its presence is what enables compute_metrics, and
# WER is meaningless on ST; the per-language WER split is also mis-attributed
# under DDP because the langs buffer is rank-local. eval_<name>_loss is the
# metric this test reports.

optimization:
  adam_beta1: 0.9
  adam_beta2: 0.95
  encoder_lr: 6e-6
  decoder_lr: 2e-5
  adapter_lr: 2e-4
  min_lr_scale: 0.1
